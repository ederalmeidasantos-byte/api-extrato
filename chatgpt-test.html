<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT - Sistema Inteligente</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.2rem;
        }
        .test-section {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
            margin: 2rem 0;
            text-align: left;
        }
        .test-section h3 {
            color: #667eea;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background: #5a6fd8;
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .response {
            background: #e8f5e8;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            border-left: 4px solid #28a745;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border-left-color: #dc3545;
        }
        .status {
            background: #28a745;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: inline-block;
        }
        .back-link {
            margin-top: 2rem;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Sistema ChatGPT</h1>
        <p class="subtitle">Sistema Inteligente de Atendimento</p>
        
        <div class="status">✅ Sistema Online</div>
        
        <div class="test-section">
            <h3>🧪 Teste da API</h3>
            <p>Teste o sistema inteligente enviando uma mensagem:</p>
            
            <form id="chatForm">
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" value="12345678901" placeholder="Digite o CPF">
                </div>
                
                <div class="form-group">
                    <label for="message">Mensagem:</label>
                    <textarea id="message" rows="3" placeholder="Digite sua mensagem...">qual a parcela do meu empréstimo?</textarea>
                </div>
                
                <div class="form-group">
                    <label for="clientNumber">Número do Cliente:</label>
                    <input type="text" id="clientNumber" value="5511999999999" placeholder="Número do WhatsApp">
                </div>
                
                <button type="submit" class="btn" id="sendBtn">Enviar Mensagem</button>
            </form>
            
            <div id="response" style="display: none;"></div>
        </div>
        
        <div class="back-link">
            <a href="/">← Voltar ao Sistema Principal</a>
        </div>
        
        <div style="margin-top: 2rem; color: #666; font-size: 0.9rem;">
            <p>Versão: 1.0.0 | Sistema Inteligente funcionando</p>
        </div>
    </div>

    <script>
        document.getElementById('chatForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const sendBtn = document.getElementById('sendBtn');
            const responseDiv = document.getElementById('response');
            
            sendBtn.disabled = true;
            sendBtn.textContent = 'Enviando...';
            
            const data = {
                cpf: document.getElementById('cpf').value,
                message: document.getElementById('message').value,
                clientNumber: document.getElementById('clientNumber').value,
                chatId: '1',
                messageType: 'text'
            };
            
            try {
                const response = await fetch('/api/chatgpt-kentro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                responseDiv.style.display = 'block';
                responseDiv.className = result.success ? 'response' : 'response error';
                
                if (result.success) {
                    responseDiv.innerHTML = `
                        <h4>✅ Resposta:</h4>
                        <p><strong>${result.resposta}</strong></p>
                        <p><small>Modelo: ${result.metadata?.model || 'N/A'} | Tokens: ${result.metadata?.tokens || 0}</small></p>
                    `;
                } else {
                    responseDiv.innerHTML = `
                        <h4>❌ Erro:</h4>
                        <p>${result.error || result.message || 'Erro desconhecido'}</p>
                    `;
                }
                
            } catch (error) {
                responseDiv.style.display = 'block';
                responseDiv.className = 'response error';
                responseDiv.innerHTML = `
                    <h4>❌ Erro de Conexão:</h4>
                    <p>${error.message}</p>
                `;
            }
            
            sendBtn.disabled = false;
            sendBtn.textContent = 'Enviar Mensagem';
        });
    </script>
</body>
</html>
