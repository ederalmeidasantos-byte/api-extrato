version: '3.8'

services:
  api-lunas:
    build: .
    container_name: api-lunas
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - GIT_REPO=https://github.com/seu-usuario/api-lunas.git
      - GIT_BRANCH=master
    volumes:
      - ./var:/app/var
      - ./.env:/app/.env
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-lunas.rule=Host(`api.lunasdigital.com.br`)"
      - "traefik.http.routers.api-lunas.tls=true"
      - "traefik.http.routers.api-lunas.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-lunas.loadbalancer.server.port=3002"
    networks:
      - lunas-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - ./deploy-webhook.sh:/deploy-webhook.sh:ro
      - ./deploy-webhook.ps1:/deploy-webhook.ps1:ro
    environment:
      - PORTAINER_WEBHOOKS_ENABLED=true
    restart: unless-stopped
    networks:
      - lunas-network

networks:
  lunas-network:
    driver: bridge

volumes:
  portainer_data:
