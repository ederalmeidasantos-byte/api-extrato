version: '3.8'

services:
  # Sistema CRM
  crm:
    build: 
      context: ./crm-lunasdigital
      dockerfile: Dockerfile.crm
    container_name: crm-container
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=crm_db
      - DB_USER=postgres
      - DB_PASS=${DB_PASS}
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - lunasdigital-network

  # Sistema INSS
  inss:
    build:
      context: ./inss-simulador
      dockerfile: Dockerfile.inss
    container_name: inss-container
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=inss_db
      - DB_USER=postgres
      - DB_PASS=${DB_PASS}
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./uploads:/app/uploads
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - lunasdigital-network

  # Banco de Dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres-container
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - lunasdigital-network

  # Nginx Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf
      - ./configs/nginx-ssl.conf:/etc/nginx/conf.d/ssl.conf
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - crm
      - inss
    restart: unless-stopped
    networks:
      - lunasdigital-network

  # Redis para Cache
  redis:
    image: redis:7-alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - lunasdigital-network

  # Monitoramento
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer-container
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    networks:
      - lunasdigital-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  portainer_data:
    driver: local

networks:
  lunasdigital-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
