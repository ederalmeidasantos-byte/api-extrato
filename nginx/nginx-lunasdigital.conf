events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Configurações básicas
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;
    
    # Upstream servers
    upstream servidor_principal {
        server servidor-principal:3000;
    }
    
    upstream crm {
        server crm:3001;
    }
    
    upstream api_simulador {
        server api-simulador:3002;
    }
    
    upstream base_dados {
        server base-dados:3003;
    }
    
    # Servidor principal - lunasdigital.com.br
    server {
        listen 80;
        server_name lunasdigital.com.br www.lunasdigital.com.br;
        
        # Redirecionar para HTTPS
        return 301 https://$server_name$request_uri;
    }
    
    # Servidor HTTPS principal
    server {
        listen 443 ssl http2;
        server_name lunasdigital.com.br www.lunasdigital.com.br;
        
        # SSL (será configurado depois)
        # ssl_certificate /etc/nginx/ssl/lunasdigital.com.br.crt;
        # ssl_certificate_key /etc/nginx/ssl/lunasdigital.com.br.key;
        
        # Por enquanto, sem SSL
        listen 80;
        
        # APIs principais
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://servidor_principal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # Arquivos estáticos
        location / {
            limit_req zone=static burst=50 nodelay;
            proxy_pass http://servidor_principal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # Subdomínio INSS - inss.lunasdigital.com.br
    server {
        listen 80;
        server_name inss.lunasdigital.com.br;
        
        # APIs específicas do INSS
        location /api/kentro/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://api_simulador;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        location /api/processar-extrato {
            limit_req zone=api burst=5 nodelay;
            client_max_body_size 10M;
            proxy_pass http://api_simulador;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Simulador INSS
        location /inss/ {
            limit_req zone=static burst=30 nodelay;
            proxy_pass http://api_simulador;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Página principal do INSS
        location / {
            limit_req zone=static burst=30 nodelay;
            proxy_pass http://api_simulador;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # Subdomínio API - api.lunasdigital.com.br
    server {
        listen 80;
        server_name api.lunasdigital.com.br;
        
        # Todas as APIs
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://servidor_principal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
    
    # Subdomínio CRM - crm.lunasdigital.com.br
    server {
        listen 80;
        server_name crm.lunasdigital.com.br;
        
        # CRM
        location / {
            limit_req zone=static burst=30 nodelay;
            proxy_pass http://crm;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # Subdomínio Admin - admin.lunasdigital.com.br
    server {
        listen 80;
        server_name admin.lunasdigital.com.br;
        
        # Admin (mesmo que servidor principal por enquanto)
        location / {
            limit_req zone=static burst=30 nodelay;
            proxy_pass http://servidor_principal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

