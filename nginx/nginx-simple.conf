events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    
    # Upstream servers
    upstream servidor_principal {
        server servidor-principal:3000;
    }
    
    upstream crm {
        server crm:3001;
    }
    
    upstream api_simulador {
        server api-simulador:3002;
    }
    
    upstream base_dados {
        server base-dados:3003;
    }
    
    # Main server block
    server {
        listen 80;
        server_name lunasdigital.com.br www.lunasdigital.com.br;
        
        # Root location
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://servidor_principal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # CRM routes
        location /operacional/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://crm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # INSS simulator
        location /inss/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://api_simulador/inss/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # APIs específicas do INSS
        location /api/kentro/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://api_simulador/api/kentro/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        location /api/processar-extrato {
            limit_req zone=api burst=5 nodelay;
            client_max_body_size 10M;
            proxy_pass http://api_simulador/api/processar-extrato;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Database API
        location /api/database/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://base_dados/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # INSS subdomain
    server {
        listen 80;
        server_name inss.lunasdigital.com.br;
        
        location / {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://api_simulador/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # API subdomain
    server {
        listen 80;
        server_name api.lunasdigital.com.br;
        
        location / {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://api_simulador/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # CRM subdomain
    server {
        listen 80;
        server_name crm.lunasdigital.com.br;
        
        location / {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://crm/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

