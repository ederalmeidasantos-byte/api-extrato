<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - CRM Lunas Digital</title>
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover {
            transition: transform 0.2s ease-in-out;
        }
        .card-hover:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <a href="/" class="flex items-center space-x-3 hover:opacity-80">
                        <div class="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center">
                            <i data-feather="hexagon" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold">CRM Lunas Digital</h1>
                            <p class="text-blue-100">Gestão de Clientes</p>
                        </div>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="bg-white bg-opacity-20 hover:bg-opacity-30 px-4 py-2 rounded-lg transition-colors">
                        <i data-feather="home" class="w-4 h-4 inline mr-2"></i>
                        Dashboard
                    </a>
                    <a href="/propostas" class="bg-white bg-opacity-20 hover:bg-opacity-30 px-4 py-2 rounded-lg transition-colors">
                        <i data-feather="file-text" class="w-4 h-4 inline mr-2"></i>
                        Propostas
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8">
        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-3xl font-bold text-gray-900">Clientes</h2>
                    <p class="text-gray-600 mt-2">Gerencie todos os clientes cadastrados no sistema</p>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="bg-white rounded-lg shadow-md px-4 py-2">
                        <span class="text-sm text-gray-600">Total: </span>
                        <span id="total-clientes" class="font-bold text-blue-600">0</span>
                    </div>
                    <button onclick="loadClientes()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        <i data-feather="refresh-cw" class="w-4 h-4 inline mr-2"></i>
                        Atualizar
                    </button>
                </div>
            </div>
        </div>

        <!-- Search and Filters -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Buscar por nome</label>
                    <input type="text" id="search-nome" placeholder="Digite o nome do cliente..." 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Buscar por CPF</label>
                    <input type="text" id="search-cpf" placeholder="Digite o CPF..." 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Filtrar por fonte</label>
                    <select id="filter-fonte" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Todas as fontes</option>
                        <option value="simulador_cpf">Simulador CPF</option>
                        <option value="simulador_proposta">Simulador Proposta</option>
                        <option value="simulador_extrato">Simulador Extrato</option>
                        <option value="formulario_cliente">Formulário Cliente</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="mt-2 text-gray-600">Carregando clientes...</p>
        </div>

        <!-- Clients Table -->
        <div id="clients-content" class="hidden">
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cliente</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">CPF</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Telefone</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Benefício</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fonte</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Data</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="clients-table-body" class="bg-white divide-y divide-gray-200">
                            <!-- Client rows will be rendered here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- No Results -->
        <div id="no-results" class="hidden text-center py-12">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-feather="users" class="w-8 h-8 text-gray-400"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-900 mb-2">Nenhum cliente encontrado</h3>
            <p class="text-gray-600">Tente ajustar os filtros de busca.</p>
        </div>
    </main>

    <script>
        let allClientes = [];
        let filteredClientes = [];

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            feather.replace();
            loadClientes();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('search-nome').addEventListener('input', filterClientes);
            document.getElementById('search-cpf').addEventListener('input', filterClientes);
            document.getElementById('filter-fonte').addEventListener('change', filterClientes);
        }

        async function loadClientes() {
            try {
                const response = await fetch('/api/clientes');
                if (!response.ok) throw new Error('Erro ao carregar clientes');
                
                const data = await response.json();
                allClientes = data.clientes || [];
                filteredClientes = [...allClientes];
                
                renderClientes();
                updateTotalCount();
                
                // Show content
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('clients-content').classList.remove('hidden');
                
            } catch (error) {
                console.error('Erro ao carregar clientes:', error);
                showError('Erro ao carregar lista de clientes');
            }
        }

        function filterClientes() {
            const nomeFilter = document.getElementById('search-nome').value.toLowerCase();
            const cpfFilter = document.getElementById('search-cpf').value.toLowerCase();
            const fonteFilter = document.getElementById('filter-fonte').value;

            filteredClientes = allClientes.filter(cliente => {
                const nomeMatch = !nomeFilter || (cliente.nome && cliente.nome.toLowerCase().includes(nomeFilter));
                const cpfMatch = !cpfFilter || (cliente.cpf && cliente.cpf.includes(cpfFilter));
                const fonteMatch = !fonteFilter || cliente.fonte === fonteFilter;

                return nomeMatch && cpfMatch && fonteMatch;
            });

            renderClientes();
            updateTotalCount();
        }

        function renderClientes() {
            const tbody = document.getElementById('clients-table-body');
            tbody.innerHTML = '';

            if (filteredClientes.length === 0) {
                document.getElementById('clients-content').classList.add('hidden');
                document.getElementById('no-results').classList.remove('hidden');
                return;
            }

            document.getElementById('clients-content').classList.remove('hidden');
            document.getElementById('no-results').classList.add('hidden');

            filteredClientes.forEach(cliente => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                
                const beneficio = cliente.beneficio || {};
                const fonte = cliente.fonte || 'N/A';
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                                <i data-feather="user" class="w-5 h-5 text-blue-600"></i>
                            </div>
                            <div class="ml-4">
                                <div class="text-sm font-medium text-gray-900">${cliente.nome || 'N/A'}</div>
                                <div class="text-sm text-gray-500">ID: ${cliente.id}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${cliente.cpf || 'N/A'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${cliente.telefone || 'N/A'}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${beneficio.nomeBeneficio || 'N/A'}</div>
                        <div class="text-sm text-gray-500">NB: ${beneficio.numero || beneficio.nb || 'N/A'}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-800">
                            ${fonte.replace('_', ' ')}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatDate(cliente.createdAt)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <div class="flex space-x-2">
                            <a href="/cliente/${cliente.id}" class="text-blue-600 hover:text-blue-900">Ver detalhes</a>
                            ${cliente.propostas && cliente.propostas.length > 0 ? 
                                `<a href="/propostas?cliente=${cliente.id}" class="text-green-600 hover:text-green-900">Propostas (${cliente.propostas.length})</a>` : 
                                ''
                            }
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });

            feather.replace();
        }

        function updateTotalCount() {
            document.getElementById('total-clientes').textContent = filteredClientes.length;
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
            } catch {
                return dateString;
            }
        }

        function showError(message) {
            document.getElementById('loading').innerHTML = `
                <div class="text-center py-12">
                    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-feather="alert-triangle" class="w-8 h-8 text-red-600"></i>
                    </div>
                    <p class="text-red-600 font-medium">${message}</p>
                    <button onclick="loadClientes()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                        Tentar novamente
                    </button>
                </div>
            `;
            feather.replace();
        }
    </script>
</body>
</html>
