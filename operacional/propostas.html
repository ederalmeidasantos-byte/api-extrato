<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propostas - CRM Lunas Digital</title>
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover {
            transition: transform 0.2s ease-in-out;
        }
        .card-hover:hover {
            transform: translateY(-2px);
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-na-fila { background: #fef3c7; color: #92400e; }
        .status-cliente-aceitou { background: #d1fae5; color: #065f46; }
        .status-teste { background: #e5e7eb; color: #374151; }
        .status-nova { background: #dbeafe; color: #1e40af; }
        .status-simulacao-concluida { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <a href="/" class="flex items-center space-x-3 hover:opacity-80">
                        <div class="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center">
                            <i data-feather="hexagon" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold">CRM Lunas Digital</h1>
                            <p class="text-blue-100">Gestão de Propostas</p>
                        </div>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="bg-white bg-opacity-20 hover:bg-opacity-30 px-4 py-2 rounded-lg transition-colors">
                        <i data-feather="home" class="w-4 h-4 inline mr-2"></i>
                        Dashboard
                    </a>
                    <a href="/clientes" class="bg-white bg-opacity-20 hover:bg-opacity-30 px-4 py-2 rounded-lg transition-colors">
                        <i data-feather="users" class="w-4 h-4 inline mr-2"></i>
                        Clientes
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8">
        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-3xl font-bold text-gray-900">Propostas</h2>
                    <p class="text-gray-600 mt-2">Gerencie todas as propostas de empréstimo</p>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="bg-white rounded-lg shadow-md px-4 py-2">
                        <span class="text-sm text-gray-600">Total: </span>
                        <span id="total-propostas" class="font-bold text-blue-600">0</span>
                    </div>
                    <button onclick="loadPropostas()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        <i data-feather="refresh-cw" class="w-4 h-4 inline mr-2"></i>
                        Atualizar
                    </button>
                </div>
            </div>
        </div>

        <!-- Search and Filters -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Buscar por cliente</label>
                    <input type="text" id="search-cliente" placeholder="Nome do cliente..." 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Buscar por CPF</label>
                    <input type="text" id="search-cpf" placeholder="CPF do cliente..." 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Filtrar por status</label>
                    <select id="filter-status" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Todos os status</option>
                        <option value="Na fila">Na Fila</option>
                        <option value="CLIENTE_ACEITOU">Cliente Aceitou</option>
                        <option value="SIMULACAO_CONCLUIDA">Simulação Concluída</option>
                        <option value="NOVA">Nova</option>
                        <option value="TESTE">Teste</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Filtrar por origem</label>
                    <select id="filter-origem" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Todas as origens</option>
                        <option value="INSS_SIMULADOR">Simulador INSS</option>
                        <option value="simulador">Simulador</option>
                        <option value="TESTE_SIMULADOR">Teste Simulador</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="mt-2 text-gray-600">Carregando propostas...</p>
        </div>

        <!-- Proposals Table -->
        <div id="proposals-content" class="hidden">
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Proposta</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cliente</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Origem</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Valor</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Data</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="proposals-table-body" class="bg-white divide-y divide-gray-200">
                            <!-- Proposal rows will be rendered here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- No Results -->
        <div id="no-results" class="hidden text-center py-12">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-feather="file-text" class="w-8 h-8 text-gray-400"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-900 mb-2">Nenhuma proposta encontrada</h3>
            <p class="text-gray-600">Tente ajustar os filtros de busca.</p>
        </div>
    </main>

    <script>
        let allPropostas = [];
        let filteredPropostas = [];

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            feather.replace();
            loadPropostas();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('search-cliente').addEventListener('input', filterPropostas);
            document.getElementById('search-cpf').addEventListener('input', filterPropostas);
            document.getElementById('filter-status').addEventListener('change', filterPropostas);
            document.getElementById('filter-origem').addEventListener('change', filterPropostas);
        }

        async function loadPropostas() {
            try {
                const response = await fetch('/api/propostas');
                if (!response.ok) throw new Error('Erro ao carregar propostas');
                
                const data = await response.json();
                allPropostas = data.propostas || [];
                filteredPropostas = [...allPropostas];
                
                renderPropostas();
                updateTotalCount();
                
                // Show content
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('proposals-content').classList.remove('hidden');
                
            } catch (error) {
                console.error('Erro ao carregar propostas:', error);
                showError('Erro ao carregar lista de propostas');
            }
        }

        function filterPropostas() {
            const clienteFilter = document.getElementById('search-cliente').value.toLowerCase();
            const cpfFilter = document.getElementById('search-cpf').value.toLowerCase();
            const statusFilter = document.getElementById('filter-status').value;
            const origemFilter = document.getElementById('filter-origem').value;

            filteredPropostas = allPropostas.filter(proposta => {
                const dados = typeof proposta.dados === 'string' 
                    ? JSON.parse(proposta.dados) 
                    : proposta.dados;
                
                const cliente = dados?.cliente || {};
                const clienteNome = cliente.nome || '';
                const clienteCpf = cliente.cpf || proposta.cpf || '';
                
                const clienteMatch = !clienteFilter || clienteNome.toLowerCase().includes(clienteFilter);
                const cpfMatch = !cpfFilter || clienteCpf.includes(cpfFilter);
                const statusMatch = !statusFilter || proposta.status === statusFilter;
                const origemMatch = !origemFilter || proposta.origem === origemFilter;

                return clienteMatch && cpfMatch && statusMatch && origemMatch;
            });

            renderPropostas();
            updateTotalCount();
        }

        function renderPropostas() {
            const tbody = document.getElementById('proposals-table-body');
            tbody.innerHTML = '';

            if (filteredPropostas.length === 0) {
                document.getElementById('proposals-content').classList.add('hidden');
                document.getElementById('no-results').classList.remove('hidden');
                return;
            }

            document.getElementById('proposals-content').classList.remove('hidden');
            document.getElementById('no-results').classList.add('hidden');

            filteredPropostas.forEach(proposta => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                
                const dados = typeof proposta.dados === 'string' 
                    ? JSON.parse(proposta.dados) 
                    : proposta.dados;
                
                const cliente = dados?.cliente || {};
                const contratos = dados?.contratos || [];
                const valorTotal = calcularValorTotal(contratos);
                const statusClass = getStatusClass(proposta.status);
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
                                <i data-feather="file-text" class="w-5 h-5 text-green-600"></i>
                            </div>
                            <div class="ml-4">
                                <div class="text-sm font-medium text-gray-900">ID: ${proposta.id}</div>
                                <div class="text-sm text-gray-500">${contratos.length} contrato(s)</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${cliente.nome || 'N/A'}</div>
                        <div class="text-sm text-gray-500">${cliente.cpf || proposta.cpf || 'N/A'}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="status-badge ${statusClass}">${proposta.status || 'Sem status'}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-800">
                            ${proposta.origem || 'N/A'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${valorTotal ? `R$ ${valorTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}` : 'N/A'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatDate(proposta.createdAt || proposta.dataCriacao)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <div class="flex space-x-2">
                            <a href="/proposta/${proposta.id}" class="text-blue-600 hover:text-blue-900">Ver detalhes</a>
                            <button onclick="updateStatus('${proposta.id}', '${proposta.status}')" class="text-green-600 hover:text-green-900">Atualizar</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });

            feather.replace();
        }

        function calcularValorTotal(contratos) {
            if (!contratos || contratos.length === 0) return null;
            
            return contratos.reduce((total, contrato) => {
                const valor = contrato.valorEmprestimo || contrato.valor_liberado || contrato.troco || 0;
                const valorNumerico = typeof valor === 'string' ? parseFloat(valor.replace(/[^\d,.-]/g, '').replace(',', '.')) : valor;
                return total + (valorNumerico || 0);
            }, 0);
        }

        function getStatusClass(status) {
            const statusMap = {
                'Na fila': 'status-na-fila',
                'CLIENTE_ACEITOU': 'status-cliente-aceitou',
                'SIMULACAO_CONCLUIDA': 'status-simulacao-concluida',
                'NOVA': 'status-nova',
                'TESTE': 'status-teste',
                'TESTE_SEQUENCIAL': 'status-teste',
                'TESTE_SEQUENCIAL_2': 'status-teste',
                'TESTE_SEQUENCIAL_3': 'status-teste',
                'TESTE_SEQUENCIAL_4': 'status-teste',
                'TESTE_FINAL': 'status-teste',
                'CONTAINER_TEST': 'status-teste',
                'TESTE_PM2': 'status-teste'
            };
            return statusMap[status] || 'status-teste';
        }

        function updateStatus(propostaId, currentStatus) {
            const newStatus = prompt(`Atualizar status da proposta ${propostaId}:\n\nStatus atual: ${currentStatus}\n\nNovo status:`, currentStatus);
            
            if (newStatus && newStatus !== currentStatus) {
                fetch(`/api/propostas/${propostaId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        status: newStatus,
                        observacoes: `Status alterado de "${currentStatus}" para "${newStatus}" em ${new Date().toLocaleString('pt-BR')}`
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Status atualizado com sucesso!');
                        loadPropostas(); // Reload data
                    } else {
                        alert('Erro ao atualizar status: ' + (data.error || 'Erro desconhecido'));
                    }
                })
                .catch(error => {
                    console.error('Erro ao atualizar status:', error);
                    alert('Erro ao atualizar status');
                });
            }
        }

        function updateTotalCount() {
            document.getElementById('total-propostas').textContent = filteredPropostas.length;
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
            } catch {
                return dateString;
            }
        }

        function showError(message) {
            document.getElementById('loading').innerHTML = `
                <div class="text-center py-12">
                    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-feather="alert-triangle" class="w-8 h-8 text-red-600"></i>
                    </div>
                    <p class="text-red-600 font-medium">${message}</p>
                    <button onclick="loadPropostas()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                        Tentar novamente
                    </button>
                </div>
            `;
            feather.replace();
        }
    </script>
</body>
</html>
