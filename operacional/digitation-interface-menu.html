<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila de Digitação - Sistema Operacional Lunas</title>
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    
    <!-- Menu Padrão CSS (Inline) -->
    <style>
        /* ================== MENU PADRÃO LUNAS DIGITAL ================== */
        .menu-padrao {
          background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
          color: white;
          min-height: 100vh;
          width: 280px;
          position: fixed;
          left: 0;
          top: 0;
          z-index: 1000;
          display: flex;
          flex-direction: column;
          box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .menu-header {
          padding: 1.5rem;
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-logo {
          display: flex;
          align-items: center;
          gap: 0.75rem;
          text-decoration: none;
          color: white;
          transition: opacity 0.2s ease;
        }

        .menu-logo:hover {
          opacity: 0.8;
        }

        .logo-text {
          font-size: 1.25rem;
          font-weight: 700;
          letter-spacing: -0.025em;
        }

        .menu-items {
          flex: 1;
          padding: 1rem 0;
          overflow-y: auto;
        }

        .menu-list {
          list-style: none;
          margin: 0;
          padding: 0;
        }

        .menu-item {
          margin: 0.25rem 0;
        }

        .menu-link {
          display: flex;
          align-items: center;
          gap: 0.75rem;
          padding: 0.75rem 1.5rem;
          color: rgba(255, 255, 255, 0.8);
          text-decoration: none;
          transition: all 0.2s ease;
          border-left: 3px solid transparent;
        }

        .menu-link:hover {
          background: rgba(255, 255, 255, 0.1);
          color: white;
          border-left-color: rgba(255, 255, 255, 0.3);
        }

        .menu-item.active .menu-link {
          background: rgba(255, 255, 255, 0.15);
          color: white;
          border-left-color: #fbbf24;
          font-weight: 600;
        }

        .menu-link i {
          width: 20px;
          height: 20px;
          flex-shrink: 0;
        }

        .menu-label {
          font-size: 0.95rem;
          font-weight: 500;
        }

        .submenu {
          list-style: none;
          margin: 0;
          padding: 0;
          background: rgba(0, 0, 0, 0.1);
          max-height: 0;
          overflow: hidden;
          transition: max-height 0.3s ease;
        }

        .menu-item.expanded .submenu {
          max-height: 300px;
        }

        .submenu-item {
          margin: 0;
        }

        .submenu-link {
          display: flex;
          align-items: center;
          padding: 0.5rem 1.5rem 0.5rem 3rem;
          color: rgba(255, 255, 255, 0.7);
          text-decoration: none;
          transition: all 0.2s ease;
          font-size: 0.9rem;
        }

        .submenu-link:hover {
          background: rgba(255, 255, 255, 0.1);
          color: white;
        }

        .submenu-item.active .submenu-link {
          background: rgba(255, 255, 255, 0.15);
          color: white;
          font-weight: 600;
        }

        .menu-footer {
          padding: 1.5rem;
          border-top: 1px solid rgba(255, 255, 255, 0.1);
          background: rgba(0, 0, 0, 0.1);
        }

        .user-info {
          margin-bottom: 1rem;
        }

        .user-name {
          display: block;
          font-weight: 600;
          font-size: 0.95rem;
          margin-bottom: 0.25rem;
        }

        .user-role {
          display: block;
          font-size: 0.8rem;
          color: rgba(255, 255, 255, 0.7);
        }

        .logout-btn {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          width: 100%;
          padding: 0.75rem;
          background: rgba(239, 68, 68, 0.2);
          border: 1px solid rgba(239, 68, 68, 0.3);
          color: #fca5a5;
          border-radius: 8px;
          cursor: pointer;
          transition: all 0.2s ease;
          font-size: 0.9rem;
        }

        .logout-btn:hover {
          background: rgba(239, 68, 68, 0.3);
          border-color: rgba(239, 68, 68, 0.5);
          color: white;
        }

        .logout-btn i {
          width: 16px;
          height: 16px;
        }

        .breadcrumb {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          padding: 1rem 1.5rem;
          background: #f8fafc;
          border-bottom: 1px solid #e2e8f0;
          font-size: 0.9rem;
        }

        .breadcrumb-home {
          display: flex;
          align-items: center;
          gap: 0.25rem;
          color: #64748b;
          text-decoration: none;
          transition: color 0.2s ease;
        }

        .breadcrumb-home:hover {
          color: #1e40af;
        }

        .breadcrumb-home i {
          width: 16px;
          height: 16px;
        }

        .breadcrumb-separator {
          color: #94a3b8;
          font-weight: 500;
        }

        .breadcrumb-item {
          color: #64748b;
        }

        .breadcrumb-item.current {
          color: #1e40af;
          font-weight: 600;
        }

        /* Layout com menu lateral */
        body {
          margin: 0;
          padding: 0;
          background: #f8fafc;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .main-container {
          display: flex;
          min-height: 100vh;
        }

        .content-area {
          flex: 1;
          margin-left: 280px; /* Largura do menu */
          padding: 0;
          background: #f8fafc;
        }

        .page-content {
          padding: 2rem;
        }

        /* Estilos específicos da fila de digitação */
        .queue-filters {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .filter-row {
            display: flex;
            gap: 1rem;
            align-items: end;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #64748b;
        }

        .filter-group select,
        .filter-group input {
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.2s ease;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .filter-actions {
            display: flex;
            gap: 0.75rem;
            align-items: end;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .queue-container {
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .queue-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .queue-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e293b;
            margin: 0;
        }

        .queue-count {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        .proposal-card {
            padding: 1.5rem;
            border-bottom: 1px solid #f1f5f9;
            transition: background-color 0.2s ease;
        }

        .proposal-card:hover {
            background: #f8fafc;
        }

        .proposal-card:last-child {
            border-bottom: none;
        }

        .proposal-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .proposal-info h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e293b;
        }

        .proposal-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        .proposal-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .btn-outline {
            background: transparent;
            color: #64748b;
            border: 1px solid #d1d5db;
        }

        .btn-outline:hover {
            background: #f8fafc;
        }

        @media (max-width: 768px) {
            .content-area {
                margin-left: 0;
            }

            .page-content {
                padding: 1rem;
            }

            .filter-row {
                flex-direction: column;
            }

            .filter-group {
                min-width: 100%;
            }

            .filter-actions {
                width: 100%;
                justify-content: stretch;
            }

            .filter-actions .btn {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Menu Padrão -->
        <div id="menu-container"></div>
        
        <!-- Área de Conteúdo -->
        <div class="content-area">
            <!-- Breadcrumb -->
            <div id="breadcrumb-container"></div>
            
            <!-- Conteúdo Principal -->
            <div class="page-content">
                <!-- Filtros da Fila -->
                <div class="queue-filters">
                    <div class="filter-row">
                        <div class="filter-group">
                            <label for="filter-status">Status</label>
                            <select id="filter-status">
                                <option value="">Todos os status</option>
                                <option value="pendente">Pendente</option>
                                <option value="em-analise">Em Análise</option>
                                <option value="aprovado">Aprovado</option>
                                <option value="rejeitado">Rejeitado</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="filter-produto">Produto</label>
                            <select id="filter-produto">
                                <option value="">Todos os produtos</option>
                                <option value="portabilidade">Portabilidade</option>
                                <option value="fgts">FGTS</option>
                                <option value="inss">INSS</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="filter-data">Data</label>
                            <input type="date" id="filter-data">
                        </div>
                        <div class="filter-actions">
                            <button class="btn btn-primary" onclick="filtrarPropostas()">
                                <i data-feather="filter"></i>
                                Filtrar
                            </button>
                            <button class="btn btn-secondary" onclick="limparFiltros()">
                                <i data-feather="x"></i>
                                Limpar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Fila de Propostas -->
                <div class="queue-container">
                    <div class="queue-header">
                        <h2 class="queue-title">Fila de Digitação</h2>
                        <div class="queue-count" id="queue-count">Carregando...</div>
                    </div>
                    <div id="queue-list">
                        <!-- Propostas serão carregadas aqui -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // ================== MENU PADRÃO LUNAS DIGITAL ==================
        const MENU_CONFIG = {
          logo: {
            src: '/assets/logo-lunas.png',
            alt: 'Lunas Digital',
            link: '/operacional'
          },
          
          items: [
            {
              id: 'dashboard',
              label: 'Dashboard',
              icon: 'home',
              link: '/operacional',
              active: false
            },
            {
              id: 'clientes',
              label: 'Clientes',
              icon: 'users',
              link: '/operacional/buscar-cliente.html',
              active: false
            },
            {
              id: 'propostas',
              label: 'Propostas',
              icon: 'file-text',
              link: '/operacional/digitation-interface.html',
              active: false
            },
            {
              id: 'configuracoes',
              label: 'Configurações',
              icon: 'settings',
              submenu: [
                {
                  id: 'status-produtos',
                  label: 'Status & Produtos',
                  link: '/operacional/configuracoes-status.html'
                },
                {
                  id: 'usuarios',
                  label: 'Usuários',
                  link: '/operacional/configuracoes-usuarios.html'
                },
                {
                  id: 'sistema',
                  label: 'Sistema',
                  link: '/operacional/configuracoes-sistema.html'
                }
              ]
            }
          ]
        };

        function renderMenu(containerId = 'menu-container', currentPage = null) {
          const container = document.getElementById(containerId);
          if (!container) return;

          if (currentPage) {
            MENU_CONFIG.items.forEach(item => {
              item.active = (item.id === currentPage);
              if (item.submenu) {
                item.submenu.forEach(subItem => {
                  subItem.active = (subItem.id === currentPage);
                });
              }
            });
          }

          const menuHTML = generateMenuHTML();
          container.innerHTML = menuHTML;
          addMenuEventListeners();
          
          console.log('✅ Menu padrão carregado com sucesso');
        }

        function generateMenuHTML() {
          let html = `
            <nav class="menu-padrao lunas-menu">
              <div class="menu-header">
                <a href="${MENU_CONFIG.logo.link}" class="menu-logo">
                  <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                    <span style="font-size: 1.5rem;">🏢</span>
                  </div>
                  <span class="logo-text">Lunas Digital</span>
                </a>
              </div>
              
              <div class="menu-items">
                <ul class="menu-list">
          `;

          MENU_CONFIG.items.forEach(item => {
            html += generateMenuItemHTML(item);
          });

          html += `
                </ul>
              </div>
              
              <div class="menu-footer">
                <div class="user-info">
                  <span class="user-name">Usuário Logado</span>
                  <span class="user-role">Administrador</span>
                </div>
                <button class="logout-btn" onclick="logout()">
                  <i data-feather="log-out"></i>
                  Sair
                </button>
              </div>
            </nav>
          `;

          return html;
        }

        function generateMenuItemHTML(item) {
          let html = `
            <li class="menu-item ${item.active ? 'active' : ''}">
              <a href="${item.link || '#'}" class="menu-link" data-item-id="${item.id}">
          `;

          if (item.icon) {
            html += `<i data-feather="${item.icon}"></i>`;
          }

          html += `
                <span class="menu-label">${item.label}</span>
              </a>
          `;

          if (item.submenu && item.submenu.length > 0) {
            html += `
              <ul class="submenu">
            `;
            
            item.submenu.forEach(subItem => {
              html += `
                <li class="submenu-item ${subItem.active ? 'active' : ''}">
                  <a href="${subItem.link}" class="submenu-link" data-item-id="${subItem.id}">
                    <span class="submenu-label">${subItem.label}</span>
                  </a>
                </li>
              `;
            });
            
            html += `
              </ul>
            `;
          }

          html += `
            </li>
          `;

          return html;
        }

        function addMenuEventListeners() {
          document.querySelectorAll('.menu-item').forEach(item => {
            const link = item.querySelector('.menu-link');
            const submenu = item.querySelector('.submenu');
            
            if (submenu) {
              link.addEventListener('click', (e) => {
                e.preventDefault();
                item.classList.toggle('expanded');
              });
            }
          });

          if (typeof feather !== 'undefined') {
            feather.replace();
          }
        }

        function renderBreadcrumb(containerId = 'breadcrumb-container', path = []) {
          const container = document.getElementById(containerId);
          if (!container) return;

          let html = `
            <nav class="breadcrumb">
              <a href="/operacional" class="breadcrumb-home">
                <i data-feather="home"></i>
                Dashboard
              </a>
          `;

          path.forEach((item, index) => {
            html += `
              <span class="breadcrumb-separator">></span>
              <span class="breadcrumb-item ${index === path.length - 1 ? 'current' : ''}">
                ${item.label}
              </span>
            `;
          });

          html += `</nav>`;

          container.innerHTML = html;
          
          if (typeof feather !== 'undefined') {
            feather.replace();
          }
        }

        function logout() {
          if (confirm('Tem certeza que deseja sair?')) {
            window.location.href = '/login';
          }
        }

        // Variáveis globais
        let propostas = [];
        let propostasFiltradas = [];

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
          console.log('🚀 Página de fila de digitação carregada');
          
          // Renderizar menu
          renderMenu('menu-container', 'propostas');
          
          // Renderizar breadcrumb
          renderBreadcrumb('breadcrumb-container', [
            { label: 'Propostas' }
          ]);
          
          carregarPropostas();
          
          // Inicializar ícones Feather
          if (typeof feather !== 'undefined') {
            feather.replace();
          }
        });

        // Carregar propostas da API
        async function carregarPropostas() {
          try {
            console.log('📡 Carregando propostas...');
            const response = await fetch('/api/propostas');
            
            if (!response.ok) {
              throw new Error(`Erro HTTP: ${response.status}`);
            }
            
            const data = await response.json();
            propostas = data.propostas || [];
            propostasFiltradas = [...propostas];
            
            console.log(`✅ ${propostas.length} propostas carregadas`);
            renderizarPropostas();
            
          } catch (error) {
            console.error('❌ Erro ao carregar propostas:', error);
            mostrarErro('Erro ao carregar propostas. Tente novamente.');
          }
        }

        // Filtrar propostas
        function filtrarPropostas() {
          const status = document.getElementById('filter-status').value;
          const produto = document.getElementById('filter-produto').value;
          const data = document.getElementById('filter-data').value;

          propostasFiltradas = propostas.filter(proposta => {
            const matchStatus = !status || proposta.status === status;
            const matchProduto = !produto || proposta.produto === produto;
            const matchData = !data || proposta.data === data;
            
            return matchStatus && matchProduto && matchData;
          });

          renderizarPropostas();
        }

        // Limpar filtros
        function limparFiltros() {
          document.getElementById('filter-status').value = '';
          document.getElementById('filter-produto').value = '';
          document.getElementById('filter-data').value = '';
          
          propostasFiltradas = [...propostas];
          renderizarPropostas();
        }

        // Renderizar propostas
        function renderizarPropostas() {
          const container = document.getElementById('queue-list');
          const countElement = document.getElementById('queue-count');
          
          countElement.textContent = `${propostasFiltradas.length} proposta(s) na fila`;
          
          if (propostasFiltradas.length === 0) {
            container.innerHTML = `
              <div class="proposal-card">
                <div style="text-align: center; padding: 2rem; color: #64748b;">
                  <i data-feather="file-text" style="width: 48px; height: 48px; margin-bottom: 1rem;"></i>
                  <h3>Nenhuma proposta encontrada</h3>
                  <p>Tente ajustar os filtros de busca</p>
                </div>
              </div>
            `;
          } else {
            container.innerHTML = propostasFiltradas.map(proposta => `
              <div class="proposal-card">
                <div class="proposal-header">
                  <div class="proposal-info">
                    <h3>Proposta #${proposta.id}</h3>
                    <div class="proposal-meta">
                      <span><strong>Cliente:</strong> ${proposta.cliente || 'Nome não informado'}</span>
                      <span><strong>Produto:</strong> ${proposta.produto || 'Não informado'}</span>
                      <span><strong>Status:</strong> ${proposta.status || 'Pendente'}</span>
                      <span><strong>Data:</strong> ${proposta.data || 'Não informada'}</span>
                    </div>
                  </div>
                  <div class="proposal-actions">
                    <button class="btn btn-success btn-sm" onclick="processarProposta(${proposta.id})">
                      <i data-feather="check"></i>
                      Processar
                    </button>
                    <button class="btn btn-warning btn-sm" onclick="editarProposta(${proposta.id})">
                      <i data-feather="edit"></i>
                      Editar
                    </button>
                    <button class="btn btn-outline btn-sm" onclick="verDetalhes(${proposta.id})">
                      <i data-feather="eye"></i>
                      Ver
                    </button>
                  </div>
                </div>
              </div>
            `).join('');
          }
          
          // Reinicializar ícones Feather
          if (typeof feather !== 'undefined') {
            feather.replace();
          }
        }

        // Ações das propostas
        function processarProposta(id) {
          console.log('Processar proposta:', id);
        }

        function editarProposta(id) {
          console.log('Editar proposta:', id);
        }

        function verDetalhes(id) {
          console.log('Ver detalhes:', id);
        }

        // Mostrar erro
        function mostrarErro(mensagem) {
          const container = document.getElementById('queue-list');
          container.innerHTML = `
            <div class="proposal-card">
              <div style="text-align: center; padding: 2rem; color: #ef4444;">
                <i data-feather="alert-circle" style="width: 48px; height: 48px; margin-bottom: 1rem;"></i>
                <h3>Erro</h3>
                <p>${mensagem}</p>
              </div>
            </div>
          `;
          
          if (typeof feather !== 'undefined') {
            feather.replace();
          }
        }
    </script>
</body>
</html>
