<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila de Digitação - Sistema Operacional Lunas</title>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="/operacional/assets/crm-layout.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
        }
        
        .container {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 280px;
            background: #1e293b;
            color: white;
            padding: 1rem;
        }
        
        .main-content {
            flex: 1;
            padding: 2rem;
            background: #f8fafc;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .header h1 {
            margin: 0;
            color: #1e293b;
            font-size: 28px;
        }
        
        .btn-maximize {
            background: #f8fafc;
            color: #475569;
            border: 1px solid #e2e8f0;
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            transition: all 0.2s ease;
        }
        
        .btn-maximize:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        
        .btn-maximize.maximized {
            background: #fee2e2;
            border-color: #fecaca;
            color: #dc2626;
        }
        
        .layout {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .layout.maximized .cliente-panel {
            display: none;
        }
        
        .panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .panel-header {
            background: #f8fafc;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 700;
            color: #374151;
        }
        
        .panel-body {
            padding: 1.5rem;
        }
        
        /* Cliente */
        .cliente-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f0f9ff;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            border: 1px solid #bae6fd;
            border-left: 4px solid #3b82f6;
        }
        
        .cliente-info {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        
        .cliente-info strong {
            font-size: 18px;
            color: #0c4a6e;
            font-weight: 700;
        }
        
        .cliente-info span {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
        }
        
        .cliente-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .btn-digitar {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-digitar:hover {
            background: #2563eb;
        }
        
        /* Propostas */
        .propostas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .propostas-actions {
            display: flex;
            gap: 0.75rem;
        }
        
        .btn-action {
            background: white;
            border: 1px solid #d1d5db;
            color: #374151;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-action:hover {
            background: #f9fafb;
            border-color: #3b82f6;
            color: #3b82f6;
        }
        
        .proposta-item {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            transition: all 0.2s;
            border-left: 4px solid #10b981;
        }
        
        .proposta-item:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
        }
        
        .proposta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        
        .proposta-titulo {
            font-weight: 700;
            color: #1f2937;
            font-size: 16px;
        }
        
        .proposta-status {
            background: #fef3c7;
            color: #92400e;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .proposta-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-proposta {
            background: white;
            border: 1px solid #d1d5db;
            color: #6b7280;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        
        .btn-proposta:hover {
            background: #f9fafb;
            border-color: #3b82f6;
            color: #3b82f6;
        }
        
        .btn-proposta.danger:hover {
            background: #fef2f2;
            border-color: #ef4444;
            color: #ef4444;
        }
        
        .proposta-metrics {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 0.75rem 1rem;
            border-radius: 6px;
        }
        
        .metrics {
            display: flex;
            gap: 2rem;
        }
        
        .metric {
            text-align: center;
        }
        
        .metric-label {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .metric-value {
            font-size: 14px;
            color: #1f2937;
            font-weight: 700;
        }
        
        .proposta-meta {
            color: #6b7280;
            font-size: 12px;
        }
        
        @media (max-width: 1024px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .layout.maximized .cliente-panel {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div style="margin-bottom: 2rem;">
                <h2 style="margin: 0; color: white;">Lunas Digital</h2>
            </div>
            <nav>
                <a href="/operacional/" style="display: block; color: #94a3b8; text-decoration: none; padding: 0.75rem 0; border-bottom: 1px solid #334155;">
                    <i data-feather="home" style="width: 16px; height: 16px; margin-right: 0.75rem;"></i> Dashboard
                </a>
                <a href="/operacional/clientes.html" style="display: block; color: #94a3b8; text-decoration: none; padding: 0.75rem 0; border-bottom: 1px solid #334155;">
                    <i data-feather="users" style="width: 16px; height: 16px; margin-right: 0.75rem;"></i> Clientes
                </a>
                <a href="/operacional/digitacao.html" style="display: block; color: white; text-decoration: none; padding: 0.75rem 0; border-bottom: 1px solid #334155; font-weight: 600;">
                    <i data-feather="edit-3" style="width: 16px; height: 16px; margin-right: 0.75rem;"></i> Fila de Digitação
                </a>
                <a href="/operacional/configuracoes-status.html" style="display: block; color: #94a3b8; text-decoration: none; padding: 0.75rem 0; border-bottom: 1px solid #334155;">
                    <i data-feather="settings" style="width: 16px; height: 16px; margin-right: 0.75rem;"></i> Configurações
                </a>
            </nav>
        </aside>
        
        <main class="main-content">
            <div class="header">
                <h1><i data-feather="edit-3"></i> Fila de Digitação</h1>
            </div>
            
            <div class="layout" id="layout">
                <!-- Cliente -->
                <div class="panel cliente-panel">
                    <div class="panel-body">
                        <div class="cliente-row">
                            <div class="cliente-info">
                                <strong id="cliNome">Selecione um cliente</strong>
                                <span id="cliCPF">CPF —</span>
                                <span id="cliTelefone">—</span>
                            </div>
                            <div class="cliente-actions">
                                <button class="btn-digitar" id="btnDigitar" disabled>
                                    <i data-feather="type"></i> Digitar
                                </button>
                                <button class="btn-maximize" id="btnMaximize">
                                    <i data-feather="maximize"></i>
                                </button>
                            </div>
                        </div>
                        <div class="cliente-selector">
                            <select id="clienteSelect" style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px; background: white; margin-top: 1rem;">
                                <option value="">Selecionar cliente...</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Propostas -->
                <div class="panel">
                    <div class="panel-header">
                        <div class="propostas-header">
                            <span>Propostas</span>
                            <div class="propostas-actions">
                                <button class="btn-action" id="btnAtualizar">
                                    <i data-feather="refresh-cw"></i> Atualizar
                                </button>
                                <button class="btn-action" id="btnNova">
                                    <i data-feather="plus"></i> Nova
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="panel-body">
                        <div id="listaPropostas">
                            <!-- Propostas serão carregadas aqui -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Dados reais
        let clientes = [];
        let propostas = [];
        let clienteAtual = null;
        let propostasCliente = [];

        function formatCurrency(value) {
            if (typeof value === 'string') {
                value = parseFloat(value.replace(/[^\d,.-]/g, '').replace(',', '.'));
            }
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value || 0);
        }

        function formatCPF(cpf) {
            return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        }

        function formatPhone(phone) {
            return phone.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
        }

        async function carregarClientes() {
            try {
                const response = await fetch('/api/clientes');
                if (!response.ok) throw new Error('Erro ao carregar clientes');
                clientes = await response.json();
                console.log('Clientes carregados:', clientes.length);
            } catch (error) {
                console.error('Erro ao carregar clientes:', error);
                // Fallback para dados mock
                clientes = [
                    {
                        id: "1",
                        dadosCompletos: {
                            nome: "MARIA SILVA SANTOS",
                            cpf: "12345678901",
                            telefone: "11999887766"
                        }
                    }
                ];
            }
        }

        async function carregarPropostas() {
            try {
                const response = await fetch('/api/propostas');
                if (!response.ok) throw new Error('Erro ao carregar propostas');
                propostas = await response.json();
                console.log('Propostas carregadas:', propostas.length);
            } catch (error) {
                console.error('Erro ao carregar propostas:', error);
                propostas = [];
            }
        }

        function popularSeletorClientes() {
            const select = document.getElementById('clienteSelect');
            select.innerHTML = '<option value="">Selecionar cliente...</option>';
            
            clientes.forEach(cliente => {
                const option = document.createElement('option');
                option.value = cliente.id;
                option.textContent = `${cliente.dadosCompletos.nome} - ${formatCPF(cliente.dadosCompletos.cpf)}`;
                select.appendChild(option);
            });
        }

        function selecionarCliente(cliente) {
            clienteAtual = cliente;
            propostasCliente = propostas.filter(p => p.clientId === cliente.id);
            
            // Atualizar interface do cliente
            document.getElementById('cliNome').textContent = cliente.dadosCompletos.nome;
            document.getElementById('cliCPF').textContent = 'CPF ' + formatCPF(cliente.dadosCompletos.cpf);
            document.getElementById('cliTelefone').textContent = formatPhone(cliente.dadosCompletos.telefone);
            
            // Habilitar botão digitar
            document.getElementById('btnDigitar').disabled = false;
            
            renderPropostas();
        }

        function renderPropostas() {
            const container = document.getElementById('listaPropostas');
            container.innerHTML = '';
            
            if (propostasCliente.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 2rem; color: #6b7280;">
                        <i data-feather="inbox" style="width: 48px; height: 48px; margin-bottom: 1rem;"></i>
                        <p>Nenhuma proposta encontrada para este cliente</p>
                    </div>
                `;
                feather.replace();
                return;
            }
            
            propostasCliente.forEach(proposta => {
                const div = document.createElement('div');
                div.className = 'proposta-item';
                
                // Extrair dados dos contratos
                const contratos = proposta.contratos || [];
                const contratoPrincipal = contratos.find(c => c.selecionado) || contratos[0];
                
                const banco = contratoPrincipal?.banco || 'N/A';
                const produto = 'Portabilidade com troco';
                const parcela = contratoPrincipal?.valor_parcela || 0;
                const saldo = contratoPrincipal?.saldo_devedor || 0;
                const taxa = contratoPrincipal?.taxa_juros_mensal || 0;
                const prazo = contratoPrincipal?.prazo_restante || 0;
                
                div.innerHTML = `
                    <div class="proposta-header">
                        <div class="proposta-titulo">Banco ${banco} • ${produto}</div>
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <span class="proposta-status">${proposta.status || 'Na Fila'}</span>
                            <div class="proposta-actions">
                                <button class="btn-proposta btn-visualizar" data-id="${proposta.id}">
                                    <i data-feather="eye"></i> Visualizar
                                </button>
                                <button class="btn-proposta btn-cancelar danger" data-id="${proposta.id}">
                                    <i data-feather="x"></i> Cancelar
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="proposta-metrics">
                        <div class="metrics">
                            <div class="metric">
                                <div class="metric-label">Parcela</div>
                                <div class="metric-value">${formatCurrency(parcela)}</div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">Saldo</div>
                                <div class="metric-value">${formatCurrency(saldo)}</div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">Taxa</div>
                                <div class="metric-value">${taxa}% a.m.</div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">Prazo</div>
                                <div class="metric-value">${prazo}x</div>
                            </div>
                        </div>
                        <div class="proposta-meta">ID ${proposta.id} • ${new Date(proposta.timestamp).toLocaleString('pt-BR')}</div>
                    </div>
                `;
                container.appendChild(div);
            });
            
            // Adicionar event listeners
            container.querySelectorAll('.btn-visualizar').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.dataset.id;
                    const proposta = propostasCliente.find(p => p.id === id);
                    if (proposta) {
                        alert(`Visualizar proposta ${id}\nCliente: ${proposta.cliente.nome}\nStatus: ${proposta.status}`);
                    }
                });
            });
            
            container.querySelectorAll('.btn-cancelar').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.dataset.id;
                    if (confirm('Cancelar esta proposta?')) {
                        // Aqui você pode implementar a lógica para cancelar a proposta
                        console.log('Cancelando proposta:', id);
                        // Atualizar a lista após cancelamento
                        propostasCliente = propostasCliente.filter(p => p.id !== id);
                        renderPropostas();
                    }
                });
            });
            
            // Re-inicializar ícones
            feather.replace();
        }

        function toggleMaximize() {
            const layout = document.getElementById('layout');
            const btn = document.getElementById('btnMaximize');
            
            layout.classList.toggle('maximized');
            
            if (layout.classList.contains('maximized')) {
                btn.innerHTML = '<i data-feather="minimize"></i> Restaurar';
            } else {
                btn.innerHTML = '<i data-feather="maximize"></i> Maximizar propostas';
            }
            
            feather.replace();
        }

        // Event listeners
        document.getElementById('btnMaximize').addEventListener('click', toggleMaximize);
        document.getElementById('btnDigitar').addEventListener('click', () => {
            if (clienteAtual) {
                alert(`Redirecionar para página de digitação do cliente: ${clienteAtual.dadosCompletos.nome}`);
            }
        });
        document.getElementById('btnAtualizar').addEventListener('click', async () => {
            await carregarPropostas();
            if (clienteAtual) {
                selecionarCliente(clienteAtual);
            }
        });
        document.getElementById('btnNova').addEventListener('click', () => {
            if (clienteAtual) {
                alert(`Criar nova proposta para: ${clienteAtual.dadosCompletos.nome}`);
            } else {
                alert('Selecione um cliente primeiro');
            }
        });
        document.getElementById('clienteSelect').addEventListener('change', (e) => {
            const clienteId = e.target.value;
            if (clienteId) {
                const cliente = clientes.find(c => c.id === clienteId);
                if (cliente) {
                    selecionarCliente(cliente);
                }
            } else {
                // Limpar seleção
                clienteAtual = null;
                propostasCliente = [];
                document.getElementById('cliNome').textContent = 'Selecione um cliente';
                document.getElementById('cliCPF').textContent = 'CPF —';
                document.getElementById('cliTelefone').textContent = '—';
                document.getElementById('btnDigitar').disabled = true;
                renderPropostas();
            }
        });

        // Atalho teclado F
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f' && !e.ctrlKey && !e.altKey) {
                toggleMaximize();
            }
        });

        // Inicializar
        document.addEventListener('DOMContentLoaded', async () => {
            feather.replace();
            
            // Carregar dados
            await carregarClientes();
            await carregarPropostas();
            
            // Popular seletor de clientes
            popularSeletorClientes();
            
            // Selecionar primeiro cliente se existir
            if (clientes.length > 0) {
                document.getElementById('clienteSelect').value = clientes[0].id;
                selecionarCliente(clientes[0]);
            }
        });
    </script>
</body>
</html>
