    <script>
        let propostaData = null;
        let contratosSelecionados = [];

        // Carregar dados da proposta (otimizado)
        function carregarProposta() {
            try {
                const propostaId = window.location.pathname.split('/').pop();
                
                console.log('🚀 Função carregarProposta executada');
                console.log('🔍 URL atual:', window.location.href);
                console.log('🔍 PropostaId extraído:', propostaId);
                
                if (!propostaId) {
                    document.body.innerHTML = '<div style="text-align: center; padding: 2rem; color: #ef4444;">❌ ID da proposta não encontrado!</div>';
                    return;
                }

                console.log('🔍 Buscando proposta:', propostaId);
                
                // Buscar dados da proposta via API
                fetch(`/api/proposta/${propostaId}`)
                    .then(response => {
                        console.log('📡 Resposta da API:', response.status);
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }
                        return response.json();
                    })
                    .then(result => {
                        console.log('✅ Dados recebidos:', result);
                        console.log('🔍 Result.success:', result.success);
                        console.log('🔍 Result.dados:', result.dados);
                        
                        if (result.success && result.dados) {
                            propostaData = result.dados;
                            console.log('✅ Proposta carregada:', propostaId);

                            // Renderizar interface de forma assíncrona
                            setTimeout(() => {
                                renderizarCliente();
                                renderizarContratos();
                                atualizarResumo();
                            }, 10);
                        } else {
                            console.error('❌ Dados inválidos:', result);
                            throw new Error('Dados da proposta inválidos');
                        }
                    })
                    .catch(error => {
                        console.error('❌ Erro ao carregar proposta:', error);
                        document.body.innerHTML = `
                            <div style="text-align: center; padding: 2rem; color: #ef4444;">
                                <h2>❌ Erro ao carregar proposta</h2>
                                <p>ID: ${propostaId}</p>
                                <p>Erro: ${error.message}</p>
                                <button onclick="location.reload()" style="
                                    background: #3b82f6; 
                                    color: white; 
                                    padding: 10px 20px; 
                                    border: none; 
                                    border-radius: 8px; 
                                    cursor: pointer; 
                                    margin-top: 1rem;
                                ">
                                    🔄 Tentar Novamente
                                </button>
                            </div>
                        `;
                    });
                
            } catch (error) {
                console.error('❌ Erro ao carregar proposta:', error);
                document.body.innerHTML = '<div style="text-align: center; padding: 2rem; color: #ef4444;">❌ Erro inesperado ao carregar proposta!</div>';
            }
        }

        function renderizarCliente() {
            console.log('🎨 Renderizando cliente...');
            console.log('🔍 propostaData:', propostaData);
            
            if (!propostaData) {
                console.error('❌ propostaData não está definida!');
                return;
            }
            
            const container = document.getElementById('clienteInfo');
            const cliente = propostaData.cliente;
            
            console.log('🔍 Container encontrado:', container);
            console.log('🔍 Dados do cliente:', cliente);
            
            if (container && cliente) {
                container.innerHTML = `
                    <div class="details-grid">
                        <div class="detail-item">
                            <div class="detail-label">Nome</div>
                            <div class="detail-value">${cliente.nome || '-'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Número do Benefício</div>
                            <div class="detail-value">${cliente.nb || '-'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Espécie</div>
                            <div class="detail-value">${cliente.especie || '-'}</div>
                        </div>
                    </div>
                `;
            } else {
                console.error('❌ Container ou cliente não encontrado!');
            }
        }

        function renderizarContratos() {
            console.log('🎨 Renderizando contratos...');
            console.log('🔍 propostaData:', propostaData);
            
            if (!propostaData) {
                console.error('❌ propostaData não está definida!');
                return;
            }
            
            const container = document.getElementById('contratosList');
            const contratos = propostaData.contratos;
            
            console.log('🔍 Container encontrado:', container);
            console.log('🔍 Dados dos contratos:', contratos);

            if (container && contratos) {
                if (!contratos || contratos.length === 0) {
                    container.innerHTML = `
                        <div class="no-data">
                            <div class="no-data-icon">📄</div>
                            <h3>Nenhum contrato disponível</h3>
                            <p>Não há contratos aprovados nesta proposta</p>
                        </div>
                    `;
                } else {
                    let html = '';
                    contratos.forEach((contrato, index) => {
                        html += `
                            <div class="contrato-item">
                                <div class="contrato-header">
                                    <div class="contrato-title">
                                        <span class="contrato-info">Contrato ${contrato.contrato || contrato.id} - ${contrato.banco?.nome || 'Banco'}</span>
                                    </div>
                                    <div class="contrato-actions">
                                        <span class="troco-value">TROCO R$ ${contrato.simulacao?.troco || 0}</span>
                                    </div>
                                </div>
                                <div class="contrato-detalhes">
                                    <div class="contrato-info-grid">
                                        <div class="info-item">
                                            <span class="info-label">Valor da Parcela:</span>
                                            <span class="info-value">R$ ${contrato.valor_parcela || 'N/A'}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">Valor Liberado:</span>
                                            <span class="info-value">R$ ${contrato.valor_liberado || 'N/A'}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">Parcelas Pagas:</span>
                                            <span class="info-value">${contrato.parcelas_pagas || 0} de ${contrato.prazo_total || 0}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">Taxa de Juros:</span>
                                            <span class="info-value">${contrato.taxa_juros_mensal || 'N/A'}%</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                }
            } else {
                console.error('❌ Container ou contratos não encontrados!');
            }
        }

        function renderizarContratosAsync(contratos, container, index) {
            if (index >= contratos.length) {
                // Finalizar renderização
                feather.replace();
                return;
            }

            const contrato = contratos[index];
            const contratoDiv = document.createElement('div');
            contratoDiv.className = 'contrato-item';
            
            // Criar HTML do contrato de forma mais eficiente
            const bancoNome = contrato.banco?.nome || contrato.simulacao?.bancoNome || 'Banco';
            const trocoValue = contrato.simulacao?.troco || 0;
            
            contratoDiv.innerHTML = `
                <div class="contrato-header">
                    <div class="contrato-title">
                        <input type="checkbox" class="contrato-checkbox" 
                               onchange="toggleContrato('${contrato.id}')" 
                               ${contrato.selecionado ? 'checked' : ''}>
                        <span class="contrato-info">Contrato ${contrato.contrato || contrato.id} - ${bancoNome}</span>
                    </div>
                    <div class="contrato-actions">
                        <span class="troco-value">TROCO R$ ${formatBRNumber(trocoValue)}</span>
                        <button class="expand-btn" onclick="toggleDetalhes('${contrato.id}')">
                            <i data-feather="chevron-right" class="feather-icon small"></i>
                        </button>
                    </div>
                </div>
                <div class="contrato-detalhes" id="detalhes-${contrato.id}">
                    <!-- Detalhes carregados sob demanda -->
                    <div style="padding: 1rem; text-align: center; color: #64748b;">
                        Clique para ver detalhes do contrato
                    </div>
                </div>
            `;
            
            container.appendChild(contratoDiv);
            
            // Continuar renderização do próximo contrato
            setTimeout(() => renderizarContratosAsync(contratos, container, index + 1), 10);
        }

        function toggleContrato(contratoId) {
            const contrato = propostaData.contratos.find(c => {
                // Tentar encontrar por ID numérico ou string
                return c.id == contratoId || 
                       c.contrato == contratoId || 
                       c.numero_contrato == contratoId ||
                       (c.id && c.id.toString() === contratoId.toString());
            });
            
            if (contrato) {
                contrato.selecionado = !contrato.selecionado;
                console.log(`🔘 Contrato ${contratoId} ${contrato.selecionado ? 'selecionado' : 'desmarcado'}`);
                atualizarResumo();
            } else {
                console.error('❌ Contrato não encontrado:', contratoId);
                console.log('📋 Contratos disponíveis:', propostaData.contratos.map(c => ({
                    id: c.id,
                    contrato: c.contrato,
                    numero_contrato: c.numero_contrato
                })));
            }
        }

        function toggleDetalhes(contratoId) {
            const detalhes = document.getElementById(`detalhes-${contratoId}`);
            const btn = event.target.closest('.expand-btn');
            const icon = btn.querySelector('.feather-icon');
            
            if (detalhes.classList.contains('expanded')) {
                detalhes.classList.remove('expanded');
                btn.classList.remove('expanded');
                icon.setAttribute('data-feather', 'chevron-right');
            } else {
                // Carregar detalhes sob demanda
                carregarDetalhesContrato(contratoId);
                detalhes.classList.add('expanded');
                btn.classList.add('expanded');
                icon.setAttribute('data-feather', 'chevron-down');
            }
            
            feather.replace();
        }
        
        function carregarDetalhesContrato(contratoId) {
            const contrato = propostaData.contratos.find(c => {
                // Tentar encontrar por ID numérico ou string
                return c.id == contratoId || 
                       c.contrato == contratoId || 
                       c.numero_contrato == contratoId ||
                       (c.id && c.id.toString() === contratoId.toString());
            });
            if (!contrato) {
                console.error('❌ Contrato não encontrado para detalhes:', contratoId);
                return;
            }
            
            const detalhes = document.getElementById(`detalhes-${contratoId}`);
            
            // Carregar HTML dos detalhes
            detalhes.innerHTML = `
                <!-- Seção CONTRATO ATUAL -->
                <div class="contract-section">
                    <div class="section-header">
                        <i data-feather="file-text" class="feather-icon small"></i>
                        <h4 class="section-title">Contrato Atual</h4>
                    </div>
                    <div class="section-content">
                        <div class="section-details">
                            <div class="section-detail-item">
                                <div class="section-detail-label">Banco</div>
                                <div class="section-detail-value">${contrato.banco?.nome || 'N/A'} (${contrato.banco?.codigo || 'N/A'})</div>
                            </div>
                            <div class="section-detail-item">
                                <div class="section-detail-label">Parcela</div>
                                <div class="section-detail-value">R$ ${formatBRNumber(contrato.valor_parcela || 0)}</div>
                            </div>
                            <div class="section-detail-item">
                                <div class="section-detail-label">Prazo</div>
                                <div class="section-detail-value">${contrato.prazo_total || 0} parcelas</div>
                            </div>
                            <div class="section-detail-item">
                                <div class="section-detail-label">Parcelas Pagas</div>
                                <div class="section-detail-value">${contrato.parcelas_pagas || 0}</div>
                            </div>
                            <div class="section-detail-item">
                                <div class="section-detail-label">Taxa</div>
                                <div class="section-detail-value">${contrato.taxa_juros_mensal || 0}% a.m.</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Seção NOVO CONTRATO -->
                <div class="contract-section">
                    <div class="section-header">
                        <i data-feather="refresh-cw" class="feather-icon small"></i>
                        <h4 class="section-title">Novo Contrato</h4>
                    </div>
                    <div class="section-content">
                        <div class="section-details">
                            <div class="section-detail-item">
                                <div class="section-detail-label">Banco</div>
                                <div class="section-detail-value">${contrato.simulacao?.banco || contrato.simulacao?.bancoNome || 'N/A'}</div>
                            </div>
                            <div class="section-detail-item">
                                <div class="section-detail-label">Nova Parcela</div>
                                <div class="section-detail-value">R$ ${formatBRNumber(contrato.simulacao?.valorParcela || contrato.simulacao?.parcela || 0)}</div>
                            </div>
                            <div class="section-detail-item">
                                <div class="section-detail-label">Prazo</div>
                                <div class="section-detail-value">${contrato.simulacao?.parcelas || 96} parcelas</div>
                            </div>
                            <div class="section-detail-item">
                                <div class="section-detail-label">Nova Taxa</div>
                                <div class="section-detail-value">${contrato.simulacao?.taxa || 0}% a.m.</div>
                            </div>
                            <div class="section-detail-item">
                                <div class="section-detail-label">Troco</div>
                                <div class="section-detail-value">R$ ${formatBRNumber(contrato.simulacao?.troco || 0)}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Atualizar ícones apenas deste contrato
            feather.replace();
        }

        function atualizarResumo() {
            console.log('🎨 Atualizando resumo...');
            const contratosSelecionados = propostaData.contratos.filter(c => c.selecionado);
            const totalTroco = contratosSelecionados.reduce((sum, c) => sum + (c.simulacao.troco || 0), 0);
            
            console.log('🔍 Contratos selecionados:', contratosSelecionados.length);
            console.log('🔍 Total troco:', totalTroco);

            document.getElementById('totalSelecionados').textContent = contratosSelecionados.length;
            document.getElementById('totalTroco').textContent = formatBRNumber(totalTroco);
        }

        function contratar() {
            const contratosSelecionados = propostaData.contratos.filter(c => c.selecionado);
            
            if (contratosSelecionados.length === 0) {
                alert('Selecione pelo menos um contrato para contratar!');
                return;
            }

            const totalTroco = contratosSelecionados.reduce((sum, c) => sum + (c.simulacao.troco || 0), 0);
            
            // Atualizar texto do modal
            document.getElementById('modalText').innerHTML = 
                `Confirmar contratação de <strong>${contratosSelecionados.length} contrato(s)</strong> com troco total de <strong>R$ ${formatBRNumber(totalTroco)}</strong>?`;
            
            // Atualizar lista de contratos no modal
            const modalContratos = document.getElementById('modalContratos');
            modalContratos.innerHTML = contratosSelecionados.map(contrato => `
                <div class="modal-contrato-item">
                    <div class="modal-contrato-info">
                        <div class="modal-contrato-banco">${contrato.simulacao?.bancoNome || contrato.simulacao?.banco || 'Banco'}</div>
                        <div class="modal-contrato-detalhes">
                            ${contrato.simulacao?.parcelas || 96}x de R$ ${formatBRNumber(contrato.simulacao?.valorParcela || contrato.simulacao?.parcela || 0)}
                        </div>
                    </div>
                    <div class="modal-contrato-valor">
                        R$ ${formatBRNumber(contrato.simulacao?.troco || 0)}
                    </div>
                </div>
            `).join('');
            
            // Mostrar modal
            document.getElementById('modalConfirmacao').classList.add('show');
        }

        function fecharModal() {
            document.getElementById('modalConfirmacao').classList.remove('show');
        }

        /**
         * Verificar se cliente já existe por CPF ou NB
         */
        async function verificarClienteExistente(cpf, nb) {
            try {
                console.log('🔍 Verificando cliente existente...', { cpf, nb });
                
                // Verificar se ClientManager está disponível
                if (typeof window.clientManager === 'undefined') {
                    console.log('📥 ClientManager não carregado, carregando...');
                    await loadClientManager();
                }
                
                // Buscar cliente por CPF ou NB
                let clienteEncontrado = null;
                
                window.clientManager.clients.forEach((cliente, id) => {
                    const clienteCpf = cliente.cpf?.replace(/\D/g, '') || '';
                    const clienteNb = cliente.nb?.replace(/\D/g, '') || '';
                    const buscaCpf = cpf?.replace(/\D/g, '') || '';
                    const buscaNb = nb?.replace(/\D/g, '') || '';
                    
                    if ((buscaCpf && clienteCpf === buscaCpf) || (buscaNb && clienteNb === buscaNb)) {
                        clienteEncontrado = id;
                        console.log('✅ Cliente existente encontrado:', id, cliente);
                    }
                });
                
                if (clienteEncontrado) {
                    return clienteEncontrado;
                }
                
                // Se não encontrou localmente, tentar buscar na Kentro
                console.log('🌐 Cliente não encontrado localmente, buscando na Kentro...');
                const clienteKentro = await buscarClienteNaKentro(cpf, nb);
                
                if (clienteKentro) {
                    console.log('✅ Cliente encontrado na Kentro, sincronizando...');
                    // Criar cliente local com dados da Kentro
                    const novoClienteId = window.clientManager.createOrUpdateClient({
                        ...clienteKentro,
                        sincronizado: true,
                        dataUltimaSync: new Date().toISOString()
                    });
                    
                    return novoClienteId;
                }
                
                console.log('⚠️ Cliente não encontrado nem localmente nem na Kentro');
                return null;
                
            } catch (error) {
                console.error('❌ Erro ao verificar cliente existente:', error);
                return null;
            }
        }

        /**
         * Buscar cliente na Kentro API
         */
        async function buscarClienteNaKentro(cpf, nb) {
            try {
                console.log('🌐 Buscando cliente na Kentro API...');
                
                // Carregar KentroIntegration se necessário
                if (typeof window.kentroIntegration === 'undefined') {
                    await loadKentroIntegration();
                }
                
                let cliente = null;
                
                // Buscar por CPF primeiro
                if (cpf) {
                    cliente = await window.kentroIntegration.buscarPorCpf(cpf.replace(/\D/g, ''));
                }
                
                // Se não encontrou por CPF, tentar por NB
                if (!cliente && nb) {
                    cliente = await window.kentroIntegration.buscarPorNb(nb.replace(/\D/g, ''));
                }
                
                return cliente;
                
            } catch (error) {
                console.error('❌ Erro ao buscar na Kentro:', error);
                return null;
            }
        }

        /**
         * Carregar KentroIntegration dinamicamente
         */
        async function loadKentroIntegration() {
            return new Promise((resolve, reject) => {
                if (typeof window.kentroIntegration !== 'undefined') {
                    resolve();
                    return;
                }
                
                const script = document.createElement('script');
                script.src = '/operacional/kentro-integration.js';
                script.onload = () => {
                    window.kentroIntegration = new KentroIntegration();
                    console.log('✅ KentroIntegration carregado');
                    resolve();
                };
                script.onerror = () => {
                    console.error('❌ Erro ao carregar KentroIntegration');
                    reject(new Error('Falha ao carregar KentroIntegration'));
                };
                document.head.appendChild(script);
            });
        }

        /**
         * Carregar ClientManager dinamicamente
         */
        async function loadClientManager() {
            return new Promise((resolve, reject) => {
                if (typeof window.clientManager !== 'undefined') {
                    resolve();
                    return;
                }
                
                const script = document.createElement('script');
                script.src = '/operacional/client-manager.js';
                script.onload = () => {
                    window.clientManager = new ClientManager();
                    console.log('✅ ClientManager carregado');
                    resolve();
                };
                script.onerror = () => {
                    console.error('❌ Erro ao carregar ClientManager');
                    reject(new Error('Falha ao carregar ClientManager'));
                };
                document.head.appendChild(script);
            });
        }
        
        function confirmarContratacao() {
            const contratosSelecionados = propostaData.contratos.filter(c => c.selecionado);
            const totalTroco = contratosSelecionados.reduce((sum, c) => sum + (c.simulacao.troco || 0), 0);
            
            // Fechar modal
            fecharModal();
            
            if (contratosSelecionados.length === 0) {
                alert('⚠️ Selecione pelo menos um contrato para contratar!');
                return;
            }
            
            try {
                // Carregar ClientManager dinamicamente se não estiver disponível
                if (typeof window.clientManager === 'undefined') {
                    const script = document.createElement('script');
                    script.src = '/operacional/client-manager.js';
                    script.onload = () => {
                        console.log('✅ ClientManager carregado, processando contratação...');
                        setTimeout(() => confirmarContratacao(), 100);
                    };
                    script.onerror = () => {
                        console.error('❌ Erro ao carregar ClientManager');
                        confirmarContratacaoManual(contratosSelecionados, totalTroco);
                    };
                    document.head.appendChild(script);
                    return;
                }
                
                // Preparar dados do cliente
                const clienteData = {
                    nome: propostaData.cliente.nome || '',
                    cpf: propostaData.cliente.cpf || '',
                    nascimento: propostaData.cliente.nascimento || '',
                    telefone: propostaData.cliente.telefone || '',
                    email: propostaData.cliente.email || '',
                    nb: propostaData.cliente.nb || '',
                    endereco: {
                        cep: propostaData.cliente.cep || '',
                        logradouro: propostaData.cliente.logradouro || '',
                        numero: propostaData.cliente.numero || '',
                        complemento: propostaData.cliente.complemento || '',
                        bairro: propostaData.cliente.bairro || '',
                        cidade: propostaData.cliente.cidade || '',
                        uf: propostaData.cliente.uf || ''
                    }
                };
                
                // Formatar contratos selecionados
                const contratosFormatados = contratosSelecionados.map((c, index) => ({
                    id: index + 1,
                    banco: c.simulacao?.bancoNovo || c.banco?.nome || 'Não definido',
                    parcelas: 96,
                    valorParcela: c.simulacao ? `R$ ${c.simulacao.parcela?.toFixed(2)}` : 'R$ 0,00',
                    taxa: c.simulacao ? `${c.simulacao.taxa}%` : '0%',
                    troco: c.simulacao ? `R$ ${c.simulacao.troco?.toFixed(2)}` : 'R$ 0,00',
                    editando: false
                }));
                
        // 🔍 VERIFICAR CLIENTE EXISTENTE PRIMEIRO
        async function processarCliente() {
            let clientId = await verificarClienteExistente(clienteData.cpf, clienteData.nb);
            
            if (clientId) {
                console.log('✅ Cliente existente encontrado:', clientId);
            // Atualizar dados do cliente existente
            try {
                window.clientManager.updateClient(clientId, clienteData);
                console.log('✅ Dados do cliente atualizados');
            } catch (updateError) {
                console.warn('⚠️ Erro ao atualizar cliente existente:', updateError);
            }
        } else {
            // Criar novo cliente
            try {
                clientId = window.clientManager.createOrUpdateClient(clienteData);
                console.log('✅ Novo cliente criado:', clientId);
            } catch (error) {
                console.error('❌ Erro ao criar cliente:', error);
                
                // Se o erro é de duplicata NB, extrair o ID do cliente existente
                if (error.message.includes('já está cadastrado para o cliente')) {
                    try {
                        // Extrair o ID do cliente da mensagem de erro
                        const match = error.message.match(/cliente\s+([a-zA-Z0-9_]+)/);
                        if (match && match[1]) {
                            clientId = match[1];
                            console.log('✅ Usando cliente existente extraído do erro:', clientId);
                        } else {
                            throw new Error('Não foi possível extrair ID do cliente da mensagem de erro');
                        }
                    } catch (extractError) {
                        console.error('❌ Erro ao extrair ID do cliente:', extractError);
                        // Fallback: gerar ID baseado no CPF
                        clientId = `cliente_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                        console.log('⚠️ Usando ID gerado como fallback:', clientId);
                    }
                } else {
                    console.error('❌ Erro não relacionado a duplicata, cancelando:', error);
                    confirmarContratacaoManual(contratosSelecionados, totalTroco);
                    return;
                }
            }
            
            // Dados da proposta
                const proposalData = {
                    extrato: {
                        data: new Date().toISOString().split('T')[0],
                        margem: propostaData.margens?.margem_disponivel_empretimo || 'R$ 0,00',
                        origem: 'Cliente - Detalhes da Proposta'
                    },
                    contratos: contratosFormatados,
                    status: 'pending',
                    origem: 'detalhes_proposta',
                    propostaOriginalId: propostaData.id
                };
                
                // Criar proposta no sistema operacional
                try {
                    const proposalId = window.clientManager.addProposalToClient(clientId, proposalData);
                    console.log('✅ Proposta criada no sistema operacional:', proposalId);
                    
                // Atualizar status para "CLIENTE_ACEITOU"
                try {
                    window.clientManager.updateProposalStatus(clientId, proposalId, 'CLIENTE_ACEITOU', {
                        origem: 'detalhes_proposta',
                        contratosCount: contratosSelecionados.length,
                        trocoTotal: totalTroco
                    });
                    console.log('✅ Status da proposta atualizado para CLIENTE_ACEITOU');
                } catch (statusError) {
                    console.warn('⚠️ Erro ao atualizar status (continuando mesmo assim):', statusError.message);
                    // Não interromper o fluxo por causa do status
                }

                // Redirecionar para formulário multi-etapas
                const kentroId = propostaData.idoportunidade || propostaData.kentroId || null;
                let formUrl = `/operacional/formulario-cliente.html?clientId=${clientId}&proposalId=${proposalId}`;
                
                if (kentroId && kentroId !== 'null' && kentroId !== '') {
                    formUrl += `&kentroId=${kentroId}`;
                    console.log('✅ KentroId incluído na URL:', kentroId);
                } else {
                    console.log('⚠️ KentroId não disponível, continuando sem ele');
                }

                // Redirecionar diretamente para o formulário
                console.log('✅ Proposta criada com sucesso!');
                console.log('🔄 Redirecionando para:', formUrl);
                
                // Mostrar notificação rápida e redirecionar
                alert(`✅ Proposta enviada com sucesso!\n\n${contratosSelecionados.length} contrato(s)\nTroco: R$ ${formatBRNumber(totalTroco)}\n\nRedirecionando para o formulário...`);
                
                // Redirecionamento direto
                setTimeout(() => {
                    window.location.href = formUrl;
                }, 500);
                    
                } catch (error) {
                    console.error('❌ Erro ao criar proposta:', error);
                    confirmarContratacaoManual(contratosSelecionados, totalTroco);
                }
                
            } catch (error) {
                console.error('❌ Erro geral na contratação:', error);
                confirmarContratacaoManual(contratosSelecionados, totalTroco);
            }
        }
        
        // Chamar a função processarCliente
        processarCliente();
        
        // Função de fallback para contratação manual
        function confirmarContratacaoManual(contratosSelecionados, totalTroco) {
            alert(`✅ Contratação realizada com sucesso!\n\n${contratosSelecionados.length} contrato(s) contratado(s)\nTroco total: R$ ${formatBRNumber(totalTroco)}\n\nEm breve você receberá mais informações.`);
        }
        
        // Função para mostrar modal de redirecionamento
        function mostrarModalRedirecionamento(clientId, proposalId, contratosSelecionados, totalTroco, formUrl) {
            // Criar modal de sucesso com redirecionamento automático
            const modal = document.createElement('div');
            modal.className = 'modal-overlay show';
            modal.style.cssText = `
                position: fixed;

                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
            `;
            
            modal.innerHTML = `
                <div style="
                    background: white;
                    border-radius: 16px;
                    padding: 2rem;
                    max-width: 400px;
                    width: 90%;
                    text-align: center;
                    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
                ">
                    <div style="
                        width: 80px;

                        background: linear-gradient(135deg, #10b981, #059669);
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        margin: 0 auto 1.5rem auto;
                        color: white;
                        font-size: 2rem;
                    ">
                        ✓
                    </div>
                    <h2 style="color: #1e293b; margin-bottom: 1rem; font-size: 1.5rem;">
                        🎉 Sucesso!
                    </h2>
                    <p style="color: #64748b; margin-bottom: 1.5rem; line-height: 1.6;">
                        <strong>Contratos enviados com sucesso!</strong><br>
                        <strong>Contratos:</strong> ${contratosSelecionados.length}<br>
                        <strong>Troco Total:</strong> R$ ${formatBRNumber(totalTroco)}<br><br>
                        <span id="countdown" style="color: #3b82f6; font-weight: 600;">Redirecionando em 3 segundos...</span>
                    </p>
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <button onclick="redirecionarAgora('${formUrl}')" 
                               style="
                                 background: linear-gradient(135deg, #3b82f6, #1d4ed8);
                                 color: white;
                                 padding: 12px 24px;
                                 border: none;
                                 border-radius: 8px;
                                 font-weight: 600;
                                 cursor: pointer;
                                 display: flex;
                                 align-items: center;
                                 gap: 8px;
                               ">
                            📝 Ir Agora
                        </button>
                        <button onclick="cancelarRedirecionamento()" 
                                style="
                                  background: #f3f4f6;
                                  color: #374151;
                                  border: 1px solid #d1d5db;
                                  padding: 12px 24px;
                                  border-radius: 8px;
                                  font-weight: 600;
                                  cursor: pointer;
                                ">
                            ✕ Cancelar
                        </button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // Countdown e redirecionamento automático
            let countdown = 3;
            const countdownElement = modal.querySelector('#countdown');
            
            window.redirectTimer = setInterval(() => {
                countdown--;
                if (countdownElement) {
                    countdownElement.textContent = `Redirecionando em ${countdown} segundos...`;
                }
                
                if (countdown <= 0) {
                    clearInterval(window.redirectTimer);
                    document.body.removeChild(modal);
                    console.log('🔄 Redirecionando automaticamente para:', formUrl);
                    window.location.href = formUrl;
                }
            }, 1000);
        }
        
        // Funções auxiliares para o modal
        function redirecionarAgora(url) {
            if (window.redirectTimer) {
                clearInterval(window.redirectTimer);
            }
            console.log('🔄 Redirecionamento manual para:', url);
            window.location.href = url;
        }
        
        function cancelarRedirecionamento() {
            if (window.redirectTimer) {
                clearInterval(window.redirectTimer);
            }
            document.querySelectorAll('.modal-overlay').forEach(modal => {
                if (modal.parentElement) {
                    modal.parentElement.removeChild(modal);
                }
            });
        }

        // Função para mostrar sucesso da integração
        function mostrarSucessoIntegracao(clientId, proposalId, contratosSelecionados, totalTroco, formUrl) {
            // Criar modal de sucesso personalizado
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';

            modal.innerHTML = `

                    max-width: 500px;

                ">
                    <div style="

                    </div>

                    </h2>
                    <p style="color: #64748b; margin-bottom: 1.5rem; line-height: 1.6;">
                        <strong>Cliente:</strong> ${propostaData.cliente.nome}<br>
                        <strong>CPF:</strong> ${propostaData.cliente.cpf}<br>
                        <strong>Contratos:</strong> ${contratosSelecionados.length}<br>
                        <strong>Troco Total:</strong> R$ ${formatBRNumber(totalTroco)}
                    </p>
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <a href="${formUrl}" 
                           style="
                             background: linear-gradient(135deg, #3b82f6, #1d4ed8);
                             color: white;

                           ">

                        </a>
                        <a href="/operacional/fila-digitation.html" 
                           target="_blank" 
                           style="

        function formatBRNumber(value) {
            return parseFloat(value || 0).toLocaleString('pt-BR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                fecharModal();
            }
        });

        // Ver resumo do cliente
        function verResumoCliente() {
            try {
                if (!propostaData || !propostaData.cliente) {
                    alert('❌ Dados do cliente não encontrados');
                    return;
                }
                
                const cliente = propostaData.cliente;
                const cpf = cliente.cpf || cliente.documento || '';
                const nb = cliente.nb || cliente.numerobeneficio || '';
                
                console.log('🔍 Abrindo busca para cliente:', cliente.nome);
                
                // Construir URL de busca
                let searchUrl = '/operacional/buscar-cliente.html';
                
                if (cpf) {
                    searchUrl += `?search=${encodeURIComponent(cpf)}&type=cpf`;
                } else if (nb) {
                    searchUrl += `?search=${encodeURIComponent(nb)}&type=nb`;
                } else {
                    searchUrl += `?search=${encodeURIComponent(cliente.nome)}&type=nome`;
                }
                
                // Abrir em nova aba
                window.open(searchUrl, '_blank');
                
            } catch (error) {
                console.error('❌ Erro ao abrir resumo do cliente:', error);
                alert('❌ Erro ao abrir resumo do cliente');
            }
        }
        
        // Simular novamente
        function simularNovamente() {
            try {
                if (!propostaData || !propostaData.cliente) {
                    alert('❌ Dados do cliente não encontrados');
                    return;
                }
                
                const cliente = propostaData.cliente;
                console.log('🧮 Abrindo simulador para:', cliente.nome);
                
                // Construir dados do cliente para o simulador
                const clienteParams = {
                    nome: cliente.nome || '',
                    cpf: cliente.cpf || cliente.documento || '',
                    nb: cliente.nb || cliente.numerobeneficio || '',
                    telefone: cliente.telefone || '',
                    email: cliente.email || ''
                };
                
                // Construir URL do simulador
                let simulatorUrl = '/INSS/simulador.html';
                const params = new URLSearchParams();
                
                Object.keys(clienteParams).forEach(key => {
                    if (clienteParams[key]) {
                        params.append(key, clienteParams[key]);
                    }
                });
                
                if (params.toString()) {
                    simulatorUrl += '?' + params.toString();
                }
                
                // Abrir simulador em nova aba
                window.open(simulatorUrl, '_blank');
                
            } catch (error) {
                console.error('❌ Erro ao abrir simulador:', error);
                alert('❌ Erro ao abrir simulador');
            }
        }

        // Inicialização otimizada
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 DOM carregado, iniciando carregamento de dados...');
            carregarProposta();
        });
