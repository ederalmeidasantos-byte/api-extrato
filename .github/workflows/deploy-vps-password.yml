name: 🚀 Deploy VPS Hostinger (Senha)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🔧 Instalar expect
      run: |
        sudo apt-get update
        sudo apt-get install -y expect
        
    - name: 🚀 Deploy no VPS (com senha)
      run: |
        echo "🚀 Iniciando deploy no VPS com senha..."
        
        # Criar script expect
        cat > deploy_script.exp << 'EOF'
        #!/usr/bin/expect -f
        set timeout 30
        set host "${{ secrets.VPS_HOST }}"
        set user "${{ secrets.VPS_USER }}"
        set password "${{ secrets.VPS_PASSWORD }}"
        
        spawn ssh $user@$host
        expect "password:"
        send "$password\r"
        expect "$ "
        
        # Comandos de deploy
        send "pm2 status\r"
        expect "$ "
        
        send "pm2 stop api-extrato || true\r"
        expect "$ "
        
        send "cd ${{ secrets.VPS_PATH }}\r"
        expect "$ "
        
        send "git pull origin master\r"
        expect "$ "
        
        send "npm install --production\r"
        expect "$ "
        
        send "pm2 restart api-extrato || pm2 start ecosystem.config.cjs\r"
        expect "$ "
        
        send "pm2 status\r"
        expect "$ "
        
        send "curl -f http://localhost:3000/api/health || echo 'Aplicação não respondeu'\r"
        expect "$ "
        
        send "exit\r"
        expect eof
        EOF
        
        chmod +x deploy_script.exp
        ./deploy_script.exp
        
        echo "🎉 Deploy concluído com sucesso!"
        
    - name: 📊 Status do Deploy
      run: |
        echo "🌐 Aplicação disponível em: https://lunasdigital.com.br/"
        echo "📅 Deploy realizado em: $(date)"
        echo "🔗 Commit: ${{ github.sha }}"

