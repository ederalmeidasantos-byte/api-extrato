# Redirecionar HTTPS para HTTP (temporário)
server {
    listen 443 ssl;
    server_name lunasdigital.com.br www.lunasdigital.com.br;
    
    # SSL auto-signed (temporário)
    ssl_certificate /etc/ssl/certs/lunasdigital.crt;
    ssl_certificate_key /etc/ssl/private/lunasdigital.key;
    
    return 301 http://$server_name$request_uri;
}

server {
    listen 80;
    server_name lunasdigital.com.br www.lunasdigital.com.br;

    # Root directory
    root /var/www/html;
    index index.html index.htm;

    # Logs
    access_log /var/log/nginx/lunasdigital_access.log;
    error_log /var/log/nginx/lunasdigital_error.log;

    # ================== ARQUIVOS ESTÁTICOS ==================
    
    # Servir arquivos estáticos diretamente
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ================== SISTEMA OPERACIONAL ==================
    
    location /operacional {
        try_files $uri $uri/ @operacional;
    }
    
    location @operacional {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ================== SISTEMA FGTS ==================
    
    location /fgts {
        try_files $uri $uri/ @fgts;
    }
    
    location @fgts {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ================== SISTEMA INSS ==================
    
    location /inss {
        try_files $uri $uri/ @inss;
    }
    
    location @inss {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ================== API ENDPOINTS ==================
    
    location /api/ {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ================== ROTA PRINCIPAL ==================
    
    location / {
        try_files $uri $uri/ @backend;
    }
    
    location @backend {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ================== SEGURANÇA ==================
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Hide nginx version
    server_tokens off;

    # ================== UPLOAD LIMITS ==================
    
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;
}