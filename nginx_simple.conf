events {
    worker_connections 1024;
}

http {
    upstream api-simulador {
        server 72.60.159.149:3002;
    }

    server {
        listen 80;
        server_name inss.lunasdigital.com.br;

        # Rotas gerais de API
        location /api/ {
            proxy_pass http://api-simulador/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rotas INSS
        location /inss/ {
            proxy_pass http://api-simulador/inss/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Extração
        location /extrair {
            proxy_pass http://api-simulador/extrair;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Extrato raw
        location /extrato/ {
            proxy_pass http://api-simulador/extrato/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}


