services:
  - type: web
    name: painel-fgts
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LUNAS_API_KEY
        sync: false
      - key: QUEUE_ID
        value: 25
      - key: DEST_STAGE_ID
        value: 4
      - key: FGTS_USER_1
        sync: false
      - key: FGTS_PASS_1
        sync: false
      - key: FGTS_USER_2
        sync: false
      - key: FGTS_PASS_2
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    rootDir: .
    # ====== PERSISTENT DISK CONFIGURATION ======
    # IMPORTANTE: Configure o Persistent Disk no painel do Render:
    # 1. Acesse: https://dashboard.render.com
    # 2. Entre no projeto painel-fgts
    # 3. Vá em Settings → Disks
    # 4. Clique em "Add Disk"
    # 5. Configure:
    #    - Mount Path: /var/data
    #    - Size: 1 GB (ou conforme necessário)
    # 6. Clique em "Add Disk"
    # 
    # O sistema automaticamente criará os diretórios:
    # - /var/data/cache (cache FGTS)
    # - /var/data/extratos (extratos JSON)
    # - /var/data/uploads (arquivos enviados)
    # - /var/data/logs (logs do sistema)
    # - /var/data/config (configurações)