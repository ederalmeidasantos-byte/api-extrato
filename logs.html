<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Logs do Servidor - API Extrato</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .controls {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, #00d4aa 0%, #5a67d8 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,212,170,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        .btn-info {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 600;
        }

        .status.online {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.offline {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .logs-container {
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
            background: #1e1e1e;
            color: #f8f8f2;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
        }

        .log-line {
            margin-bottom: 2px;
            padding: 2px 0;
            border-left: 3px solid transparent;
            padding-left: 10px;
        }

        .log-line.error {
            border-left-color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
        }

        .log-line.warn {
            border-left-color: #f39c12;
            background: rgba(243, 156, 18, 0.1);
        }

        .log-line.info {
            border-left-color: #3498db;
            background: rgba(52, 152, 219, 0.1);
        }

        .log-line.success {
            border-left-color: #27ae60;
            background: rgba(39, 174, 96, 0.1);
        }

        .log-line.debug {
            border-left-color: #9b59b6;
            background: rgba(155, 89, 182, 0.1);
        }

        .timestamp {
            color: #6c757d;
            font-size: 12px;
        }

        .log-level {
            font-weight: bold;
            margin-right: 10px;
        }

        .log-level.ERROR { color: #e74c3c; }
        .log-level.WARN { color: #f39c12; }
        .log-level.INFO { color: #3498db; }
        .log-level.SUCCESS { color: #27ae60; }
        .log-level.DEBUG { color: #9b59b6; }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .auto-refresh input[type="checkbox"] {
            transform: scale(1.2);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-logs {
            text-align: center;
            padding: 40px;
            color: #6c757d;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .auto-refresh {
                margin-left: 0;
                justify-content: center;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Logs do Servidor</h1>
            <p>Monitoramento em tempo real da API Extrato</p>
        </div>

        <div class="controls">
            <button class="btn" onclick="loadLogs()">
                🔄 Atualizar Logs
            </button>
            <button class="btn btn-danger" onclick="clearLogs()">
                🗑️ Limpar Logs
            </button>
            <button class="btn btn-warning" onclick="restartServer()">
                🔄 Reiniciar Servidor
            </button>
            <button class="btn btn-info" onclick="downloadLogs()">
                💾 Baixar Logs
            </button>
            
            <div class="auto-refresh">
                <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()">
                <label for="autoRefresh">Auto-refresh (5s)</label>
            </div>
            
            <div id="serverStatus" class="status loading">
                <div class="spinner" style="width: 20px; height: 20px; border-width: 2px;"></div>
                Verificando status...
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3 id="totalLogs">0</h3>
                <p>Total de Logs</p>
            </div>
            <div class="stat-card">
                <h3 id="errorLogs">0</h3>
                <p>Erros</p>
            </div>
            <div class="stat-card">
                <h3 id="warningLogs">0</h3>
                <p>Avisos</p>
            </div>
            <div class="stat-card">
                <h3 id="uptime">--</h3>
                <p>Tempo Online</p>
            </div>
        </div>

        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
            <p>Carregando logs...</p>
        </div>

        <div class="logs-container" id="logsContainer">
            <div class="empty-logs">
                Clique em "Atualizar Logs" para carregar os logs do servidor
            </div>
        </div>
    </div>

    <script>
        let autoRefreshInterval = null;
        let logs = [];

        // Verificar status do servidor
        async function checkServerStatus() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                
                const statusElement = document.getElementById('serverStatus');
                if (data.status === 'success') {
                    statusElement.className = 'status online';
                    statusElement.innerHTML = '🟢 Servidor Online';
                } else {
                    statusElement.className = 'status offline';
                    statusElement.innerHTML = '🔴 Servidor Offline';
                }
            } catch (error) {
                const statusElement = document.getElementById('serverStatus');
                statusElement.className = 'status offline';
                statusElement.innerHTML = '🔴 Servidor Offline';
            }
        }

        // Carregar logs
        async function loadLogs() {
            const loadingSpinner = document.getElementById('loadingSpinner');
            const logsContainer = document.getElementById('logsContainer');
            
            loadingSpinner.style.display = 'block';
            logsContainer.innerHTML = '';

            try {
                const response = await fetch('/api/logs');
                const data = await response.json();
                
                if (data.success) {
                    logs = data.logs || [];
                    displayLogs();
                    updateStats();
                } else {
                    logsContainer.innerHTML = '<div class="empty-logs">❌ Erro ao carregar logs: ' + data.error + '</div>';
                }
            } catch (error) {
                logsContainer.innerHTML = '<div class="empty-logs">❌ Erro de conexão: ' + error.message + '</div>';
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }

        // Exibir logs
        function displayLogs() {
            const logsContainer = document.getElementById('logsContainer');
            
            if (logs.length === 0) {
                logsContainer.innerHTML = '<div class="empty-logs">📝 Nenhum log encontrado</div>';
                return;
            }

            const logsHTML = logs.map(log => {
                const logClass = getLogClass(log.level);
                const timestamp = new Date(log.timestamp).toLocaleString('pt-BR');
                
                return `
                    <div class="log-line ${logClass}">
                        <span class="timestamp">[${timestamp}]</span>
                        <span class="log-level ${log.level}">${log.level}</span>
                        <span class="log-message">${log.message}</span>
                    </div>
                `;
            }).join('');

            logsContainer.innerHTML = logsHTML;
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        // Determinar classe CSS do log
        function getLogClass(level) {
            switch(level) {
                case 'ERROR': return 'error';
                case 'WARN': return 'warn';
                case 'INFO': return 'info';
                case 'SUCCESS': return 'success';
                case 'DEBUG': return 'debug';
                default: return 'info';
            }
        }

        // Atualizar estatísticas
        function updateStats() {
            document.getElementById('totalLogs').textContent = logs.length;
            document.getElementById('errorLogs').textContent = logs.filter(log => log.level === 'ERROR').length;
            document.getElementById('warningLogs').textContent = logs.filter(log => log.level === 'WARN').length;
        }

        // Limpar logs
        function clearLogs() {
            if (confirm('Tem certeza que deseja limpar os logs?')) {
                logs = [];
                displayLogs();
                updateStats();
            }
        }

        // Reiniciar servidor
        async function restartServer() {
            if (confirm('Tem certeza que deseja reiniciar o servidor?')) {
                try {
                    const response = await fetch('/api/restart', { method: 'POST' });
                    const data = await response.json();
                    
                    if (data.success) {
                        alert('✅ Servidor reiniciado com sucesso!');
                        setTimeout(() => {
                            checkServerStatus();
                            loadLogs();
                        }, 3000);
                    } else {
                        alert('❌ Erro ao reiniciar servidor: ' + data.error);
                    }
                } catch (error) {
                    alert('❌ Erro de conexão: ' + error.message);
                }
            }
        }

        // Baixar logs
        function downloadLogs() {
            const logsText = logs.map(log => 
                `[${new Date(log.timestamp).toLocaleString('pt-BR')}] ${log.level}: ${log.message}`
            ).join('\n');
            
            const blob = new Blob([logsText], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `logs-${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        // Toggle auto-refresh
        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            
            if (checkbox.checked) {
                autoRefreshInterval = setInterval(() => {
                    loadLogs();
                    checkServerStatus();
                }, 5000);
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            checkServerStatus();
            loadLogs();
        });
    </script>
</body>
</html>
