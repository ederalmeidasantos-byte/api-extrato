<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Teste - FGTS</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
            min-height: 100vh; 
            color: #334155; 
            padding: 2rem;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { 
            background: linear-gradient(135deg, #00d4aa 0%, #5a67d8 50%, #7c3aed 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            background-clip: text; 
            font-size: 2.5rem; 
            font-weight: 700; 
            margin-bottom: 0.5rem; 
        }
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 1.5rem; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
            margin-bottom: 1.5rem;
        }
        .btn { 
            padding: 0.75rem 1.5rem; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            font-size: 0.9rem;
            margin: 0.25rem;
        }
        .btn-primary { background: linear-gradient(135deg, #00d4aa 0%, #5a67d8 100%); color: white; }
        .btn-secondary { background: #64748b; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15); }
        .status { 
            padding: 1rem; 
            border-radius: 8px; 
            margin: 1rem 0; 
            font-family: monospace; 
            font-size: 0.9rem;
        }
        .status.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .status.info { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
        .status.warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
        .log { 
            background: #1e293b; 
            color: #e2e8f0; 
            border-radius: 8px; 
            padding: 1rem; 
            height: 300px; 
            overflow-y: auto; 
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace; 
            font-size: 0.8rem; 
            line-height: 1.5; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #00d4aa 0%, #5a67d8 100%);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 212, 170, 0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .back-btn:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(0, 212, 170, 0.4); }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='/fgts'" title="Voltar ao Painel">←</button>
    
    <div class="container">
        <div class="header">
            <h1>🧪 Página de Teste</h1>
            <p>Teste de funcionalidades do sistema FGTS</p>
        </div>

        <div class="grid">
            <!-- Teste de APIs -->
            <div class="card">
                <h3>🔌 Teste de APIs</h3>
                <div style="margin-bottom: 1rem;">
                    <button class="btn btn-primary" onclick="testarAPI('status')">📊 Status do Sistema</button>
                    <button class="btn btn-secondary" onclick="testarAPI('config')">⚙️ Configurações</button>
                    <button class="btn btn-success" onclick="testarAPI('cache')">💾 Cache</button>
                </div>
                <div id="apiStatus" class="status info">Clique em um botão para testar as APIs</div>
            </div>

            <!-- Teste de Socket.IO -->
            <div class="card">
                <h3>📡 Teste de Socket.IO</h3>
                <div style="margin-bottom: 1rem;">
                    <button class="btn btn-primary" onclick="testarSocket()">🔗 Conectar Socket</button>
                    <button class="btn btn-secondary" onclick="enviarMensagemTeste()">📤 Enviar Mensagem</button>
                    <button class="btn btn-danger" onclick="desconectarSocket()">❌ Desconectar</button>
                </div>
                <div id="socketStatus" class="status info">Socket não conectado</div>
            </div>

            <!-- Teste de Upload -->
            <div class="card">
                <h3>📁 Teste de Upload</h3>
                <div style="margin-bottom: 1rem;">
                    <input type="file" id="testFile" accept=".csv" style="margin-bottom: 1rem;">
                    <button class="btn btn-primary" onclick="testarUpload()">📤 Testar Upload</button>
                </div>
                <div id="uploadStatus" class="status info">Selecione um arquivo CSV para testar</div>
            </div>

            <!-- Teste de Performance -->
            <div class="card">
                <h3>⚡ Teste de Performance</h3>
                <div style="margin-bottom: 1rem;">
                    <button class="btn btn-primary" onclick="testarPerformance()">🚀 Iniciar Teste</button>
                    <button class="btn btn-secondary" onclick="limparLogs()">🗑️ Limpar Logs</button>
                </div>
                <div id="performanceStatus" class="status info">Pronto para teste de performance</div>
            </div>
        </div>

        <!-- Logs em Tempo Real -->
        <div class="card">
            <h3>📜 Logs em Tempo Real</h3>
            <div id="logs" class="log"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let isConnected = false;

        // Função para adicionar log
        function adicionarLog(mensagem, tipo = 'info') {
            const timestamp = new Date().toLocaleTimeString('pt-BR');
            const logEntry = `[${timestamp}] ${mensagem}\n`;
            const logs = document.getElementById('logs');
            logs.textContent += logEntry;
            logs.scrollTop = logs.scrollHeight;
        }

        // Função para atualizar status
        function atualizarStatus(elementId, mensagem, tipo = 'info') {
            const element = document.getElementById(elementId);
            element.textContent = mensagem;
            element.className = `status ${tipo}`;
        }

        // Teste de APIs
        async function testarAPI(tipo) {
            atualizarStatus('apiStatus', '🔄 Testando...', 'warning');
            
            try {
                let url = '';
                switch(tipo) {
                    case 'status':
                        url = '/fgts/status';
                        break;
                    case 'config':
                        url = '/fgts/config';
                        break;
                    case 'cache':
                        url = '/fgts/cache/estatisticas';
                        break;
                }

                const response = await fetch(url);
                const data = await response.json();
                
                if (response.ok) {
                    atualizarStatus('apiStatus', `✅ ${tipo.toUpperCase()}: ${JSON.stringify(data, null, 2)}`, 'success');
                    adicionarLog(`✅ API ${tipo} testada com sucesso`);
                } else {
                    atualizarStatus('apiStatus', `❌ Erro ${response.status}: ${data.message || 'Erro desconhecido'}`, 'error');
                    adicionarLog(`❌ Erro na API ${tipo}: ${response.status}`);
                }
            } catch (error) {
                atualizarStatus('apiStatus', `❌ Erro: ${error.message}`, 'error');
                adicionarLog(`❌ Erro ao testar API ${tipo}: ${error.message}`);
            }
        }

        // Teste de Socket.IO
        function testarSocket() {
            if (isConnected) {
                atualizarStatus('socketStatus', '⚠️ Socket já conectado', 'warning');
                return;
            }

            socket.on('connect', () => {
                isConnected = true;
                atualizarStatus('socketStatus', '✅ Socket conectado com sucesso', 'success');
                adicionarLog('✅ Socket.IO conectado');
            });

            socket.on('disconnect', () => {
                isConnected = false;
                atualizarStatus('socketStatus', '❌ Socket desconectado', 'error');
                adicionarLog('❌ Socket.IO desconectado');
            });

            socket.on('log', (message) => {
                adicionarLog(`📨 Socket: ${message}`);
            });

            socket.on('resultadoCPF', (data) => {
                adicionarLog(`📊 Resultado CPF: ${JSON.stringify(data)}`);
            });

            socket.connect();
        }

        function enviarMensagemTeste() {
            if (!isConnected) {
                atualizarStatus('socketStatus', '❌ Socket não conectado', 'error');
                return;
            }

            socket.emit('teste', { mensagem: 'Teste de Socket.IO', timestamp: new Date().toISOString() });
            adicionarLog('📤 Mensagem de teste enviada via Socket.IO');
        }

        function desconectarSocket() {
            if (!isConnected) {
                atualizarStatus('socketStatus', '⚠️ Socket já desconectado', 'warning');
                return;
            }

            socket.disconnect();
            isConnected = false;
            atualizarStatus('socketStatus', '❌ Socket desconectado', 'error');
            adicionarLog('❌ Socket.IO desconectado manualmente');
        }

        // Teste de Upload
        async function testarUpload() {
            const fileInput = document.getElementById('testFile');
            const file = fileInput.files[0];
            
            if (!file) {
                atualizarStatus('uploadStatus', '❌ Nenhum arquivo selecionado', 'error');
                return;
            }

            atualizarStatus('uploadStatus', '🔄 Enviando arquivo...', 'warning');
            
            const formData = new FormData();
            formData.append('csvfile', file);

            try {
                const response = await fetch('/fgts/run', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (response.ok) {
                    atualizarStatus('uploadStatus', `✅ Upload realizado: ${data.message}`, 'success');
                    adicionarLog(`✅ Upload realizado: ${file.name}`);
                } else {
                    atualizarStatus('uploadStatus', `❌ Erro no upload: ${data.message || 'Erro desconhecido'}`, 'error');
                    adicionarLog(`❌ Erro no upload: ${response.status}`);
                }
            } catch (error) {
                atualizarStatus('uploadStatus', `❌ Erro: ${error.message}`, 'error');
                adicionarLog(`❌ Erro no upload: ${error.message}`);
            }
        }

        // Teste de Performance
        async function testarPerformance() {
            atualizarStatus('performanceStatus', '🔄 Executando teste de performance...', 'warning');
            adicionarLog('🚀 Iniciando teste de performance');
            
            const startTime = performance.now();
            let requests = 0;
            let errors = 0;

            // Testar múltiplas requisições
            const promises = [];
            for (let i = 0; i < 10; i++) {
                promises.push(
                    fetch('/fgts/status')
                        .then(response => {
                            requests++;
                            if (!response.ok) errors++;
                        })
                        .catch(() => {
                            errors++;
                        })
                );
            }

            await Promise.all(promises);
            
            const endTime = performance.now();
            const duration = endTime - startTime;
            const successRate = ((requests - errors) / requests * 100).toFixed(2);

            atualizarStatus('performanceStatus', 
                `✅ Teste concluído: ${requests} requisições em ${duration.toFixed(2)}ms (${successRate}% sucesso)`, 
                'success'
            );
            
            adicionarLog(`✅ Performance: ${requests} reqs em ${duration.toFixed(2)}ms (${successRate}% sucesso)`);
        }

        function limparLogs() {
            document.getElementById('logs').textContent = '';
            adicionarLog('🗑️ Logs limpos');
        }

        // Inicialização
        adicionarLog('🧪 Página de teste carregada');
        adicionarLog('📋 Sistema pronto para testes');
    </script>
</body>
</html>
