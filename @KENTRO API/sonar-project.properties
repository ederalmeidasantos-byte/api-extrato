sonar.projectKey=kentro-api-integration
sonar.projectName=Kentro API Integration
sonar.projectVersion=1.0.0
sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,docs/**,test-*.js,*.test.js,*.spec.js
sonar.tests=.
sonar.test.inclusions=test-*.js,*.test.js,*.spec.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=test-*.js,*.test.js,*.spec.js,examples.js
sonar.qualitygate.wait=true



