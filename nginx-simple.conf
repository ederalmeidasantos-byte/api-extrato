# Configuração HTTPS simples e funcional
server {
    listen 443 ssl http2;
    server_name lunasdigital.com.br www.lunasdigital.com.br;

    # SSL válido do Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/lunasdigital.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lunasdigital.com.br/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Root directory
    root /var/www/html;
    index index.html index.htm;

    # Logs
    access_log /var/log/nginx/lunasdigital_access.log;
    error_log /var/log/nginx/lunasdigital_error.log;

    # ================== ARQUIVOS ESTÁTICOS ==================

    # Servir arquivos estáticos diretamente
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ================== SISTEMA OPERACIONAL ==================

    location /operacional {
        alias /var/www/html/operacional;
        index index.html;
        try_files $uri $uri/ /operacional/index.html;
    }

    # ================== SISTEMA FGTS ==================

    location /fgts {
        alias /var/www/html/fgts;
        index index.html;
        try_files $uri $uri/ /fgts/index.html;
    }

    # ================== SISTEMA INSS ==================

    location /inss {
        alias /var/www/html/inss;
        index index.html;
        try_files $uri $uri/ /inss/index.html;
    }

    # ================== API ENDPOINTS ==================

    location /api/ {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ================== ROTA PRINCIPAL ==================

    location / {
        try_files $uri $uri/ =404;
    }

    # ================== SEGURANÇA ==================

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Hide nginx version
    server_tokens off;

    # ================== UPLOAD LIMITS ==================

    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;
}

# Redirecionar HTTP para HTTPS
server {
    listen 80;
    server_name lunasdigital.com.br www.lunasdigital.com.br;
    return 301 https://$server_name$request_uri;
}

