<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo circular azul -->
  <circle cx="128" cy="128" r="120" fill="#1e40af" stroke="#3b82f6" stroke-width="8"/>
  
  <!-- Símbolo de dinheiro/moeda -->
  <circle cx="128" cy="100" r="35" fill="none" stroke="#ffffff" stroke-width="6"/>
  <text x="128" y="110" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">R$</text>
  
  <!-- Linhas representando crescimento/gráfico -->
  <path d="M80 160 L100 140 L120 150 L140 130 L160 145 L180 125" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Pontos no gráfico -->
  <circle cx="100" cy="140" r="4" fill="#ffffff"/>
  <circle cx="120" cy="150" r="4" fill="#ffffff"/>
  <circle cx="140" cy="130" r="4" fill="#ffffff"/>
  <circle cx="160" cy="145" r="4" fill="#ffffff"/>
  <circle cx="180" cy="125" r="4" fill="#ffffff"/>
  
  <!-- Texto FGTS -->
  <text x="128" y="200" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold">FGTS</text>
  
  <!-- Efeito de brilho -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.3"/>
</svg>



