# Configuração Nginx para Sistema FGTS - SUBDOMÍNIO COM SSL
# Adicionar ao arquivo nginx.conf do VPS

# FGTS Server - Container Docker via SUBDOMÍNIO (HTTP - Redirect para HTTPS)
server {
    listen 80;
    server_name fgts.lunasdigital.com.br;
    
    # Redirect HTTP para HTTPS
    return 301 https://$server_name$request_uri;
}

# FGTS Server - Container Docker via SUBDOMÍNIO (HTTPS)
server {
    listen 443 ssl http2;
    server_name fgts.lunasdigital.com.br;
    
    # Certificados SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/fgts.lunasdigital.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fgts.lunasdigital.com.br/privkey.pem;
    
    # Configurações SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Proxy para container Docker na porta 3005
    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # Health check endpoint
    location /fgts/status {
        proxy_pass http://localhost:3005/fgts/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

