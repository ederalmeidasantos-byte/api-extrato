<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cache Persistente FGTS - Lunas Digital</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
            min-height: 100vh; 
            color: #334155; 
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { 
            background: linear-gradient(135deg, #00d4aa 0%, #5a67d8 50%, #7c3aed 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            background-clip: text; 
            font-size: 2.5rem; 
            font-weight: 700; 
            margin-bottom: 0.5rem; 
        }
        .header p { color: #64748b; font-size: 1.1rem; }
        
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 1.5rem; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
            margin-bottom: 1.5rem;
        }
        
        .cache-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .cache-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
        }
        
        .cache-item h4 {
            color: #1e293b;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .cache-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #64748b;
        }
        
        .cache-content {
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 6px;
            padding: 0.75rem;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .btn { 
            padding: 0.75rem 1.5rem; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            font-size: 0.9rem;
            margin: 0.25rem;
        }
        .btn-primary { background: linear-gradient(135deg, #00d4aa 0%, #5a67d8 100%); color: white; }
        .btn-secondary { background: #64748b; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15); }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }
        
        .status-active { background: #10b981; }
        .status-inactive { background: #ef4444; }
        .status-warning { background: #f59e0b; }
        
        /* Barra Lateral de Navegação */
        .sidebar { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 60px; 
            height: 100vh; 
            background: #ffffff; 
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1); 
            transition: all 0.3s ease; 
            z-index: 1000; 
            overflow-y: auto; 
            border-right: 1px solid #e5e7eb;
        }
        .sidebar.open { 
            left: 0; 
            width: 400px; 
        }
        
        /* Zona de Hover para abrir menu */
        .hover-zone {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 100vh;
            z-index: 999;
            background: transparent;
        }
        
        .hover-zone:hover + .sidebar {
            width: 400px !important;
        }
        
        .hover-zone:hover + .sidebar .sidebar-header {
            opacity: 1 !important;
        }
        
        .hover-zone:hover + .sidebar .nav-link .nav-text {
            opacity: 1 !important;
        }
        .sidebar-header { 
            padding: 1rem; 
            border-bottom: 1px solid #e5e7eb; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: linear-gradient(135deg, #00d4aa 0%, #5a67d8 50%, #7c3aed 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            position: relative;
            overflow: hidden;
            min-height: 60px;
        }
        
        .sidebar-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -20%;
            right: -20%;
            height: 100%;
            background: linear-gradient(135deg, #00d4aa 0%, #5a67d8 50%, #7c3aed 100%);
            z-index: -1;
        }
        .sidebar.open .sidebar-header {
            opacity: 1;
        }
        .sidebar-title { 
            font-size: 1.25rem; 
            font-weight: 600; 
            color: #ffffff; 
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sidebar-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #ffffff; }
        .sidebar-close:hover { color: #f1f5f9; }
        .sidebar-content { 
            padding: 0.5rem 1rem; 
            background: #ffffff;
            margin-top: -0.5rem;
        }
        .nav-menu { 
            list-style: none; 
            padding: 0;
            margin: 0;
        }
        .nav-item { 
            margin-bottom: 0.5rem; 
        }
        .nav-link { 
            display: flex; 
            align-items: center;
            padding: 0.75rem; 
            color: #64748b; 
            text-decoration: none; 
            border-radius: 8px; 
            transition: all 0.3s ease; 
            border: 1px solid transparent;
            white-space: nowrap;
            margin-bottom: 0.25rem;
        }
        
        .nav-link .nav-text {
            margin-left: 0.75rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .sidebar.open .nav-link .nav-text {
            opacity: 1;
        }
        .nav-link:hover { 
            background: #f1f5f9; 
            color: #1e293b; 
            border: 1px solid #e2e8f0;
        }
        .nav-link.active { 
            background: linear-gradient(135deg, #00d4aa 0%, #5a67d8 100%); 
            color: white; 
            border: 1px solid #00d4aa;
        }
        
        /* Estilo dos ícones - apenas quando fechado */
        .sidebar:not(.open) .nav-link {
            justify-content: center;
            padding: 0.75rem 0.5rem;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            width: 100%;
        }
        
        .sidebar:not(.open) .nav-link span:first-child {
            font-size: 1.1rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: #f1f5f9;
            color: #64748b;
            transition: all 0.3s ease;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        
        .sidebar:not(.open) .nav-link.active span:first-child {
            background: linear-gradient(135deg, #00d4aa 0%, #5a67d8 50%, #7c3aed 100%);
            color: white;
            position: relative;
        }
        
        .sidebar:not(.open) .nav-link.active span:first-child::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -18px;
            right: -18px;
            height: calc(100% + 4px);
            background: linear-gradient(135deg, #00d4aa 0%, #5a67d8 50%, #7c3aed 100%);
            border-radius: 4px;
            z-index: -1;
        }
        
        .sidebar:not(.open) .nav-link:hover span:first-child {
            background: #e2e8f0;
            color: #1e293b;
        }
        
        @media (max-width: 768px) { 
            .sidebar { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💾 Cache Persistente FGTS</h1>
            <p>Visualize e gerencie o cache persistente do sistema</p>
        </div>

        <div class="card">
            <h3>🔄 Controles de Cache</h3>
            <div style="margin-bottom: 1rem;">
                <button class="btn btn-primary" onclick="atualizarCache()">🔄 Atualizar Cache</button>
                <button class="btn btn-success" onclick="limparCache()">🧹 Limpar Cache</button>
                <button class="btn btn-warning" onclick="exportarCache()">📥 Exportar Cache</button>
                <button class="btn btn-danger" onclick="resetarCache()">🗑️ Resetar Tudo</button>
            </div>
            
            <div id="cacheStatus" style="padding: 1rem; background: #dbeafe; color: #1e40af; border-radius: 8px; margin: 1rem 0; font-family: monospace; font-size: 0.9rem;">
                Status: Carregando cache...
            </div>
        </div>

        <div class="card">
            <h3>📊 Arquivos de Cache</h3>
            <div class="cache-grid" id="cacheGrid">
                <!-- Cache items serão inseridos aqui via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Zona de Hover para abrir menu -->
    <div class="hover-zone" title="Passe o mouse aqui para abrir o menu"></div>

    <!-- Barra Lateral de Navegação -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title" id="sidebarTitle">
                <span id="sidebarIcon">💾</span>
                <span id="sidebarText">Cache</span>
            </h2>
            <button class="sidebar-close" id="sidebarClose">×</button>
        </div>
        <div class="sidebar-content">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/teste-menu" class="nav-link">
                        🏠 <span class="nav-text">Página Inicial</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/pagina-dashboard" class="nav-link">
                        📊 <span class="nav-text">Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/pagina-configuracoes" class="nav-link">
                        ⚙️ <span class="nav-text">Configurações</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/pagina-logs" class="nav-link">
                        📋 <span class="nav-text">Logs</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/pagina-cache" class="nav-link active">
                        💾 <span class="nav-text">Cache</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <script>
        // Função para atualizar header
        function atualizarHeader(icon, text) {
            const sidebarIcon = document.getElementById('sidebarIcon');
            const sidebarText = document.getElementById('sidebarText');
            
            if (sidebarIcon) sidebarIcon.textContent = icon;
            if (sidebarText) sidebarText.textContent = text;
        }

        // Função para adicionar log
        function adicionarLog(mensagem) {
            console.log(`[Cache] ${mensagem}`);
        }

        // Função para atualizar status
        function atualizarStatus(mensagem, tipo = 'info') {
            const status = document.getElementById('cacheStatus');
            status.textContent = mensagem;
            status.className = `status ${tipo}`;
        }

        // Dados simulados do cache
        const cacheData = {
            'pending-cpfs.json': {
                status: 'active',
                size: '2.3 KB',
                lastModified: '2025-01-28 15:30:45',
                items: 15,
                content: `{
  "cpfs": [
    "12345678901",
    "98765432100",
    "11122233344"
  ],
  "lastUpdate": "2025-01-28T15:30:45.000Z",
  "total": 15
}`
            },
            'v8-cache-attempts.json': {
                status: 'active',
                size: '1.8 KB',
                lastModified: '2025-01-28 15:30:42',
                items: 8,
                content: `{
  "attempts": {
    "12345678901": 2,
    "98765432100": 1,
    "11122233344": 3
  },
  "lastUpdate": "2025-01-28T15:30:42.000Z"
}`
            },
            'processing-counters.json': {
                status: 'active',
                size: '0.5 KB',
                lastModified: '2025-01-28 15:30:40',
                items: 4,
                content: `{
  "totalProcessed": 150,
  "successCount": 120,
  "errorCount": 25,
  "pendingCount": 5
}`
            },
            'scheduled-items.json': {
                status: 'warning',
                size: '3.2 KB',
                lastModified: '2025-01-28 15:30:38',
                items: 12,
                content: `{
  "scheduled": [
    {
      "cpf": "12345678901",
      "scheduledTime": "2025-01-28T16:00:00.000Z",
      "action": "whatsapp"
    }
  ],
  "lastUpdate": "2025-01-28T15:30:38.000Z"
}`
            },
            'result-lists.json': {
                status: 'active',
                size: '5.1 KB',
                lastModified: '2025-01-28 15:30:35',
                items: 45,
                content: `{
  "success": [
    {
      "cpf": "11122233344",
      "valor": 1250.00,
      "provider": "cartos",
      "timestamp": "2025-01-28T15:30:35.000Z"
    }
  ],
  "errors": [],
  "lastUpdate": "2025-01-28T15:30:35.000Z"
}`
            }
        };

        // Funções de cache
        function atualizarCache() {
            atualizarStatus('🔄 Atualizando cache...', 'warning');
            adicionarLog('Atualizando cache');
            
            // Simular atualização
            setTimeout(() => {
                carregarCache();
                atualizarStatus('✅ Cache atualizado com sucesso!', 'success');
                adicionarLog('Cache atualizado');
            }, 1500);
        }

        function limparCache() {
            if (confirm('Tem certeza que deseja limpar o cache?')) {
                atualizarStatus('🧹 Limpando cache...', 'warning');
                adicionarLog('Limpando cache');
                
                setTimeout(() => {
                    atualizarStatus('✅ Cache limpo com sucesso!', 'success');
                    adicionarLog('Cache limpo');
                    carregarCache();
                }, 1000);
            }
        }

        function exportarCache() {
            adicionarLog('Exportando cache');
            const cacheJson = JSON.stringify(cacheData, null, 2);
            const blob = new Blob([cacheJson], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cache-fgts-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function resetarCache() {
            if (confirm('Tem certeza que deseja resetar todo o cache? Esta ação não pode ser desfeita!')) {
                atualizarStatus('🗑️ Resetando cache...', 'warning');
                adicionarLog('Resetando cache');
                
                setTimeout(() => {
                    atualizarStatus('✅ Cache resetado com sucesso!', 'success');
                    adicionarLog('Cache resetado');
                    carregarCache();
                }, 2000);
            }
        }

        function carregarCache() {
            const cacheGrid = document.getElementById('cacheGrid');
            cacheGrid.innerHTML = '';

            Object.entries(cacheData).forEach(([filename, data]) => {
                const statusClass = data.status === 'active' ? 'status-active' : 
                                  data.status === 'warning' ? 'status-warning' : 'status-inactive';
                
                const cacheItem = document.createElement('div');
                cacheItem.className = 'cache-item';
                cacheItem.innerHTML = `
                    <h4>
                        <span class="status-indicator ${statusClass}"></span>
                        ${filename}
                    </h4>
                    <div class="cache-stats">
                        <span>Tamanho: ${data.size}</span>
                        <span>Itens: ${data.items}</span>
                    </div>
                    <div class="cache-stats">
                        <span>Modificado: ${data.lastModified}</span>
                        <span>Status: ${data.status}</span>
                    </div>
                    <div class="cache-content">${data.content}</div>
                `;
                cacheGrid.appendChild(cacheItem);
            });
        }

        // Aguardar DOM carregar
        document.addEventListener('DOMContentLoaded', function() {
            // Event listeners do menu
            const sidebarClose = document.getElementById('sidebarClose');
            const sidebar = document.getElementById('sidebar');
            const hoverZone = document.querySelector('.hover-zone');
            
            if (sidebarClose) {
                sidebarClose.onclick = closeMenu;
            }

            // Hover para expandir menu
            if (hoverZone && sidebar) {
                hoverZone.addEventListener('mouseenter', () => {
                    sidebar.classList.add('open');
                    adicionarLog('Menu expandido por hover');
                });
                
                sidebar.addEventListener('mouseleave', () => {
                    sidebar.classList.remove('open');
                    adicionarLog('Menu colapsado (saiu da área)');
                });
                
                // Também manter aberto quando hover no sidebar
                sidebar.addEventListener('mouseenter', () => {
                    sidebar.classList.add('open');
                });
            }

            // Event listeners para os links do menu
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    // Remover active de todos os links
                    navLinks.forEach(l => l.classList.remove('active'));
                    // Adicionar active ao link clicado
                    link.classList.add('active');
                    
                    // Atualizar header
                    const icon = link.querySelector('span:first-child').textContent.trim();
                    const text = link.querySelector('.nav-text').textContent.trim();
                    atualizarHeader(icon, text);
                    
                    adicionarLog(`Link clicado: ${icon} ${text}`);
                });
            });

            // Fechar ao clicar fora
            document.addEventListener('click', (e) => {
                if (sidebar && sidebar.classList.contains('open')) {
                    if (!sidebar.contains(e.target) && !hoverZone.contains(e.target)) {
                        sidebar.classList.remove('open');
                        adicionarLog('Menu fechado (clique fora)');
                    }
                }
            });

            // Carregar cache inicial
            carregarCache();
            atualizarStatus('✅ Cache carregado com sucesso!', 'success');
            
            // Inicialização
            adicionarLog('Página Cache carregada');
        });

        function closeMenu() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) {
                sidebar.classList.remove('open');
                adicionarLog('Menu fechado');
            }
        }
    </script>
</body>
</html>
