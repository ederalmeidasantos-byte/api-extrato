server {
    listen 80;
    listen 443 ssl http2;
    server_name lunasdigital.com.br www.lunasdigital.com.br;    

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/lunasdigital.com.br/fullchain.pem;                                                    
    ssl_certificate_key /etc/letsencrypt/live/lunasdigital.com.br/privkey.pem;                                                  
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;    
    ssl_prefer_server_ciphers off;

    # Logs
    access_log /var/log/nginx/lunasdigital_access.log;
    error_log /var/log/nginx/lunasdigital_error.log;

    # ================== ARQUIVOS ESTÁTICOS ================== 

    # ================== SISTEMA OPERACIONAL ================== 

    location /operacional/ {
        alias /var/www/html/operacional/;
        index index.html;
        try_files $uri $uri/ /operacional/index.html;
    }

    # ================== SISTEMA FGTS ==================        

    location /fgts {
        alias /var/www/html/fgts;
        index index.html;
        try_files $uri $uri/ /fgts/index.html;
    }

    # ================== SISTEMA INSS ==================        

    location /inss/ {
        alias /root/api-lunas/INSS/;
        index index.html;
        try_files $uri $uri/ /inss/index.html;
    }

    # ================== DETALHES DE PROPOSTA ==================

    location /detalhesdaproposta/ {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ================== API ENDPOINTS ==================       

    # Rotas do simulador
    location /extrato/ {
        proxy_pass http://localhost:3002;
    }

    location /kentro/ {
        proxy_pass http://localhost:3002;
    }

    location /extrair {
        proxy_pass http://localhost:3002;
    }

    location /simulador {
        proxy_pass http://localhost:3002;
    }

    location /api/ {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;                                                            
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ================== ARQUIVOS ESTÁTICOS ================== 

    # ================== ROTA PRINCIPAL ==================      

    location / {
        try_files $uri $uri/ =404;
    }

    # ================== SEGURANÇA ==================

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;                                                             
}

